name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Superpowers Project plugin
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
          choco install ripgrep -y --no-progress
          rg --version

      - name: Run source validation suite
        shell: pwsh
        run: pwsh.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate.ps1
