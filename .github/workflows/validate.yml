name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Milestones plugin
        shell: pwsh
        run: pwsh.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate.ps1
