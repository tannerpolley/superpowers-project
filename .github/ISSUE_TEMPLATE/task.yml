name: Task
description: Track repository, docs, validation, release, or maintenance work.
title: "[Task]: "
labels: ["type:task", "status:triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Task outcome
      description: What needs to be true when this task is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof oracle
    validations:
      required: true
  - type: input
    id: plan-file
    attributes:
      label: Local issue file
      description: docs/milestones/<milestone-folder>/issues/<issue-number>-<slug>.md
    validations:
      required: false
