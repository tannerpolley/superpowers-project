name: Feature
description: Propose a new Superpowers Project capability or workflow improvement.
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true when this feature is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof oracle
      description: Commands, checks, or user-visible behavior proving completion.
    validations:
      required: true
  - type: input
    id: plan-file
    attributes:
      label: Local issue file
      description: docs/superpowers/issues/<issue-number>-<slug>.md
    validations:
      required: false
