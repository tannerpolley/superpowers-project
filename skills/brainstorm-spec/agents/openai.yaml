interface:
  display_name: "Brainstorm Spec"
  short_description: "Brainstorm project specs with Superpowers, codebase context, and native user input."
  default_prompt: >-
    Use $superpowers-project:brainstorm-spec for repo-backed ideas, specs, PRDs, architecture concepts, or broad feature requests.
    Use superpowers:brainstorming as the base workflow, inspect docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, relevant docs, and code before asking;
    use request_user_input in Default mode for any unresolved brainstorming decision when callable; carry grill-me wording and pressure into assumption checks; report evidence, decision points, and assumptions to remove;
    save loose specs under docs/superpowers/specs in flat canonical roots. Specs use docs/superpowers/specs/<yyyy-mm-dd>-<slug>.md;
    milestone identity is optional, and milestone/category views use frontmatter plus milestone indexes because Milestone pages are index views. Treat nested canonical milestone artifact folders are drift.
    Route product-shaped work through to-prd behavior and architecture-heavy work through improve-codebase-architecture behavior. At closeout, complete the artifact review gate,
    inventory every produced or materially changed artifact owned by the brainstorm run, summarize the artifact in chat, state what the result means for the next workflow step and the broader project context,
    show rendered Markdown artifacts when applicable, summarize machine-readable artifacts with exact path plus key fields, ask project_brainstorm_next_step with Yes Continue From Spec, Revisit Revise / Review Brainstorm,
    and Stop; after Continue From Spec ask project_brainstorm_start_route with Manual Planning, Auto Mode, and Stop;
    Manual Planning uses nested project_brainstorm_plan_route children including Create One Plan and Multi-Spec Planning; Auto Mode asks project_auto_mode_authorization with Bounded Auto Merge, Manual Planning, and Stop,
    records an Auto Mode authorization ledger with bounded-auto-merge, recorded-defaults, issue-backed-orchestrate-only, and the repo-root Auto Mode contract helper proof before continuing,
    plus project_brainstorm_reiteration_route children including Revise Spec, then start the selected next skill in the same turn when tools and state allow it.
    If a saved-spec closeout appears to omit project_brainstorm_start_route, project_auto_mode_authorization, or Bounded Auto Merge, treat that as stale-thread recovery:
    warn that the loaded thread may still be using older skill text, re-ask the missed native route, and continue from the corrected path instead of stopping or inferring approval from the stale behavior.
    After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate.
    A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question.
    Final completion must use an explicit final health gate with `Done`, not a `Yes` option.
    Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer.
    Only Stop can break an intermediate loop before a verified final Done gate.
    The agent must not get out of the loop by itself, and ending a turn after a governed workflow action is invalid until the next native continuation or permission question is answered.
    At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized.
    Strict artifact display is mandatory before every closeout or permission question: show what was created or revised, do not merely say something changed, include chosen brainstorm design/specs, full plan tasks and steps,
    created issue bodies or mirrors, full changed-artifact inventory, exact test values/results, cleanup evidence, branch or PR proof, machine-readable ledgers, and when large artifacts are not fully rendered show the path,
    type, action, exact sections changed, representative diff or snippet, and why the full render is omitted. After artifacts are shown, add a separate findings summary with what was done, what was fixed,
    what remains unsatisfactory or risky, the agent's own feedback/opinion, what the agent thinks those results mean, what that means for the active goal, what that means for the broader project context,
    what next steps are now recommended, active-goal impact, broader project impact, and the recommended next route. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?.
    The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route.
    Do not show Continue children beside Revisit and Stop in the same top-level question. Do not show Continue children as peer top-level options.
    Do not compress the top-level Continue? gate and a nested route decision into one prompt, one prose acknowledgement, or one inferred selection.
    If multiple forward or review routes exist, ask the top-level gate first and then the matching nested question. After Yes, ask the nested progress route question when multiple next skills are possible.
    After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate.
    Nested Yes-route menus must not include terminal options and should list only forward routes.
    Nested Revisit-route menus must not include terminal options and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists.
    Recommend Revisit when review, repair, or missing evidence is the next safe action. Stop may be selectable at the top-level gate for user control, but the agent must not recommend Stop before verified final completion.
    Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other never terminates a workflow directly.
    If a custom answer requests `Stop` or `Done`, ask a fresh confirmation question with separate built-in labels instead of terminating from Other;
    otherwise ask the next best child question or baseline nested route and keep the workflow running. Do not infer terminal intent from a custom answer. Review First is not a terminal answer.
    The terminal option must be Stop until a verified final Done gate is reached.
