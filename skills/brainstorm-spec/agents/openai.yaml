version: 1
skills:
  brainstorm-spec:
    default_prompt: "Use $project:brainstorm-spec for repo-backed ideas, specs, PRDs, architecture concepts, or broad feature requests. Use superpowers:brainstorming as the base workflow, inspect docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, relevant docs, and code before asking; use request_user_input in Default mode for any unresolved brainstorming decision when callable; carry grill-me wording and pressure into assumption checks; report evidence, decision points, and assumptions to remove; save loose specs under docs/superpowers/specs in flat canonical roots. Specs use docs/superpowers/specs/<yyyy-mm-dd>-<slug>.md; milestone identity is optional, and milestone/category views use frontmatter plus milestone indexes because Milestone pages are index views. Treat nested canonical milestone artifact folders are drift. Route product-shaped work through to-prd behavior and architecture-heavy work through improve-codebase-architecture behavior. At closeout, summarize the artifact in chat, show rendered Markdown artifacts when applicable, ask project_brainstorm_next_step with Down Continue From Spec, Left Revise / Review Brainstorm, and Right Stop / Done; use nested project_brainstorm_plan_route children including Create One Plan and Multi-Spec Planning, plus project_brainstorm_reiteration_route children including Revise Spec, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."

