interface:
  display_name: "Brainstorm Spec"
  short_description: "Brainstorm project specs with Superpowers, codebase context, and native user input."
  default_prompt: >-
    Use $project:brainstorm-spec for repo-backed ideas, specs, PRDs, architecture concepts, or broad feature requests. Use superpowers:brainstorming as the base workflow, inspect docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, relevant docs, and code before asking; use request_user_input in Default mode for any unresolved brainstorming decision when callable; carry grill-me wording and pressure into assumption checks; report evidence, decision points, and assumptions to remove; save loose specs under docs/superpowers/specs in flat canonical roots. Specs use docs/superpowers/specs/<yyyy-mm-dd>-<slug>.md; milestone identity is optional, and milestone/category views use frontmatter plus milestone indexes because Milestone pages are index views. Treat nested canonical milestone artifact folders are drift. Route product-shaped work through to-prd behavior and architecture-heavy work through improve-codebase-architecture behavior. At closeout, summarize the artifact in chat, show rendered Markdown artifacts when applicable, ask project_brainstorm_next_step with Down Continue From Spec, Left Revise / Review Brainstorm, and Right Stop; use nested project_brainstorm_plan_route children including Create One Plan and Multi-Spec Planning, plus project_brainstorm_reiteration_route children including Revise Spec, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.


