interface:
  display_name: "Audit Project"
  short_description: "Audit Superpowers Project workflow drift, tracker alignment, and repair paths."
  default_prompt: >-
    Use $project:audit-project for Superpowers Project drift audits, migration review, tracker alignment, live plugin sync drift, or repair planning. Run skills/audit-project/scripts/audit-project.ps1 first with -Mode LocalDocs or -Mode GitHubAware; use -IssueFixturePath, -MilestoneFixturePath, -LabelFixturePath, and -ProjectFixturePath for deterministic smoke tests. Use -TrackerHygiene to inspect GitHub issue routing-label drift and canonical Project V2 state drift, including closed/open status mismatches, missing status:* routing labels on open issues, missing Project items, mirror-to-Project field drift, and remaining Project V2 draft items. Use -ApplyTrackerRepairs only after native approval; its repair_receipt must list each changed GitHub issue label, Project item status, added Project item, and synced Project field. Open issues carry status:* routing labels; closed issues use GitHub closed state plus Project Done and should not keep status:* routing labels. Project V2 draft items are reported separately and are not published, converted, or deleted automatically. Audit docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, specs, plans, issues, GitHub issue mirror fields, GitHub milestone linkage, label vocabulary, retired docs/milestones canonical usage, active goal execution checks, ignored-path traps, native UI contracts, closed mirror lifecycle drift, and live plugin sync drift. Enforce flat canonical roots for spec -> plan -> issue; Milestone pages are index views, nested canonical milestone artifact folders are drift, and only explicitly marked generated index/view output is exempt. Stale closed issue mirrors are repairable drift unless marked Mirror Retention: Keep. Report first, group findings as blocking, repairable, informational, and healthy, require native repair approval before mutation, and make no mutation without user approval. At closeout, summarize the audit or repair result in chat, show rendered Markdown artifacts when applicable, ask project_doctor_next_step with Down Apply Or Prepare Repair, Left Rerun / Review Audit, and Right Stop / Done; use nested repair and review children including Apply Repair, Create Planning Spec, Run Audit Again, and Review First, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only No / Stop / Done can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and No / Stop / Done as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. No must always be Stop / Done.

