version: 1
skills:
  project-context:
    default_prompt: "Use $project-context to create or maintain the Superpowers Project large-context layer. Keep docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, specs, plans, and issue mirror contracts coherent with the GitHub tracker. Use request_user_input when callable for roadmap, milestone, tracker, or /goal execution decisions. At closeout, summarize the context result in chat, ask native question project_context_next_step with Project Brainstorm, Project Plan, Project Issue, Project Doctor, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
