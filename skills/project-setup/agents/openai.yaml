version: 1
skills:
  project-setup:
    default_prompt: "Use $project-setup for Superpowers Project setup, adoption, large-context mapping, milestone pages, GitHub tracker configuration, GitHub Project board setup, and roadmap repair under docs/superpowers. Maintain docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/agents/project-roadmap.json, and tracker configuration. Enforce flat canonical roots for the spec -> plan -> issue lifecycle: docs/superpowers/specs, docs/superpowers/plans, and docs/superpowers/issues. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes, and treat nested canonical milestone artifact folders are drift unless explicitly generated index/view output. Use request_user_input when callable for roadmap, milestone, GitHub, board creation, or /goal execution policy decisions. At closeout, summarize the setup result in chat, ask native question project_setup_next_step with Project Brainstorm, Project Plan, Project Issue, Project Doctor, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
