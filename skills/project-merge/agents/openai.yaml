version: 1
skills:
  project-merge:
    default_prompt: "Use $project-merge when a Superpowers Project PR URL or worker handoff is ready for main-thread integration. Read the linked issue mirror, source plan, setup ledger, PR-ready handoff, and verification ledger; run premerge proof; ask native request_user_input question project_merge_approval with Merge and Decline options before merging; merge only after approval; verify the linked issue closed; sync default; delete only the owned branch; remove the owned worktree; run git fetch --prune and the repo cleanup hook; then record clean closeout proof. At closeout, summarize the merge result in chat, ask native question project_merge_next_step with Project Doctor, Resolve Another, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
