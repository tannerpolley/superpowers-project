version: 1
skills:
  project-merge:
    default_prompt: "Use $project-merge when a Superpowers Project PR URL or worker handoff is ready for main-thread integration. Read the linked issue mirror, source plan, setup ledger, and PR-ready handoff; run collect-premerge-ledger.ps1 to assemble Temp Plus Evidence and pass the generated ledger to premerge.ps1; ask native request_user_input question project_merge_approval with Merge and Decline options before merging; merge only after approval; verify the linked issue closed; sync default; delete only the owned branch; remove the owned worktree; run git fetch --prune and the repo cleanup hook; delete closed issue mirrors by default unless marked Mirror Retention: Keep, preserve milestone closed summaries with GitHub issue and PR links, then run collect-closeout-ledger.ps1 and pass the generated ledger to closeout.ps1. There is no hand-authored JSON requirement for normal runs. At closeout, summarize the merge result in chat, show rendered Markdown artifacts when applicable, ask project_merge_next_step with Down Continue Project Execution, Left Review / Repair Closeout, and Right Stop / Done; use nested issue, planning, repair, and cleanup children including Resolve Another, Orchestrate Another, Review Closeout, Run Doctor, and Re-run Cleanup, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."
