interface:
  display_name: "Write Plan"
  short_description: "Write implementation plans from approved specs or issues with native grilling gates."
  default_prompt: >-
    Use $superpowers-project:write-plan when an approved Superpowers Project spec or issue mirror needs an implementation plan. Auto Mode requires an Auto Mode authorization ledger from project_auto_mode_authorization, validated by the repo-root Auto Mode contract helper, with bounded-auto-merge, recorded defaults, and stop outside policy before planning without more user input. Use superpowers:writing-plans as the base workflow, save plans under docs/superpowers/plans in flat canonical roots, link one or more loose specs or a raw approved idea plus docs/superpowers/issues when present, and keep the lifecycle spec -> plan -> issue. plans include creation date and milestone identity where applicable, for example docs/superpowers/plans/<yyyy-mm-dd>-<milestone-or-category>-<slug>-plan.md. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes and treat nested canonical milestone artifact folders are drift. Before saving a plan, use the Planning Grill Gate: apply grill-me behavior, inspect knowable context first, and use request_user_input in Default mode as a hard gate for material scope, acceptance criteria, sequencing, proof oracle, TDD policy, branch strategy, routing, publish behavior, or live mutation choices. Do not present a plan as ready until material decisions have been answered or explicitly deferred with a named risk owner. Require proof oracle evidence, require superpowers:test-driven-development for feature or bug plans unless explicit opt-out, require superpowers:systematic-debugging for bugs, and require superpowers:verification-before-completion before completion. After saving and self-reviewing the plan, summarize the plan in chat, show rendered Markdown artifacts when applicable, use advanced-user-input sequential branching, ask project_plan_next_step with Down Continue Into Work, Left Revise / Review Plan, and Right Stop. If Down is selected, ask project_plan_work_route with Down Create Work Artifact, Left Execute Existing Work, and Right Stop; then project_plan_artifact_route can choose Down Create Issue / Project Issue First to continue to `$superpowers-project:create-issues` using the saved plan path or Left Plan Implementation / Project Implement to continue to `$superpowers-project:implement-plan` using the saved plan path without creating issue mirrors. The Project Implement route does not create issue mirrors. project_plan_implementation_route prepares the selected plan implementation route on a development branch. Recommend `Project Implement` for branch-backed non-issue implementation. Recommend `Project Issue First` when the GitHub issue backbone is desired. If Left is selected, use project_plan_review_route and project_plan_review_grill_route with Review First and Revise Plan child routes. start the selected next skill in the same turn instead of only telling the user what to prompt next. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Recommend No / Stop / Done only for explicit terminal, blocker, or user-requested stop states. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.
