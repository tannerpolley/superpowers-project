interface:
  display_name: "Write Plan"
  short_description: "Write implementation plans from approved specs or issues with native grilling gates."
  default_prompt: >-
    Use $superpowers-project:write-plan when an approved Superpowers Project spec or issue mirror needs an implementation plan. Auto Mode requires an Auto Mode authorization ledger from project_auto_mode_authorization,
    Use $superpowers-project:companion-interface on opt-in runs or when long implementation plans, Task # Use Cases,
    proof oracles, or validation receipts need rich local review while native continuation remains in chat or request_user_input.
    validated by the plugin-provided Auto Mode validator, with bounded-auto-merge, recorded defaults, and stop outside policy before planning without more user input. Use superpowers:writing-plans as the base workflow,
    save plans under docs/superpowers/plans in flat canonical roots, link one or more loose specs or a raw approved idea plus docs/superpowers/issues when present, and keep the lifecycle spec -> plan -> issue.
    plans include creation date and milestone identity where applicable, for example docs/superpowers/plans/<yyyy-mm-dd>-<milestone-or-category>-<slug>-plan.md. Milestone pages are index views;
    represent milestone/category views through frontmatter plus milestone indexes and treat nested canonical milestone artifact folders are drift. Before saving a plan, use the Planning Grill Gate: apply grill-me behavior,
    inspect knowable context first, and use request_user_input in Default mode as a hard gate for material scope, acceptance criteria, sequencing, proof oracle, TDD policy, branch strategy, routing, publish behavior,
    live mutation choices, truth owner, contract interface, cutover, displaced path, evidence fields, kill criteria, and forbidden moves. Do not present a plan as ready until material decisions have been answered or explicitly deferred with a named risk owner. Before presenting a plan as ready,
    ask or record what counts as test complete, what proof demonstrates that status, what metrics define pass versus fail, and whether tolerances, edge-case thresholds, or error bounds matter.
    When the project is scientific or engineering-oriented, ask for numerical metrics, thresholds, tolerances, units, and validation coverage, then record those answers in the plan acceptance criteria and proof oracle.
    If those prompts are not applicable, record that with a clear reason before routing into work. Require every implementation plan to include ## Outcome Contract and ## Architecture Slice before tasks.
    Outcome Contract must include Truth Owner, Contract Interface, Cutover Decision, Displaced Path, Evidence Lane, Acceptance Evidence, Kill Criteria, Forbidden Moves, and Risk If Wrong.
    Architecture Slice must include Source Of Truth, Read Path, Write Path, Integration Points, Migration Or Cutover, Displaced Path Handling, and Acceptance Evidence Gate.
    Run validate-plan-outcome-contract.ps1 against the saved plan before presenting it as ready, and do not route to create-issues, implement-plan, resolve-issue, or orchestrate-issues until it passes.
    Require proof oracle evidence, require superpowers:test-driven-development for feature or bug plans unless explicit opt-out,
    and treat Task # Use Cases as a strict requirement: every numbered Task N must include a non-empty **Use Cases:** block with concrete user, system, acceptance, failure/recovery, validation, or workflow cases before files and steps.
    Run validate-plan-task-use-cases.ps1 against the saved plan before presenting it as ready, and do not route to create-issues, implement-plan, resolve-issue, or orchestrate-issues until it passes.
    require superpowers:systematic-debugging for bugs, and require superpowers:verification-before-completion before completion. After saving and self-reviewing the plan, complete the artifact review gate,
    inventory every produced or materially changed artifact owned by the planning run, summarize the plan in chat, show the Outcome Contract, Architecture Slice, every Task # Use Cases block, state what counts as test complete,
    state whether scientific or engineering numerical metrics were required,
    explain what the result means for the active goal and broader project context, show exact artifact paths and links, show rendered Markdown artifacts when applicable,
    and summarize machine-readable artifacts with exact path plus key fields. Use advanced-user-input sequential branching, ask project_plan_next_step with Yes Continue Into Work, Revisit Revise / Review Plan, and Stop.
    If Yes is selected, ask project_plan_work_route with Project Issue First, Project Implement, and Use Ready Issue; Project Issue First continues to `$superpowers-project:create-issues` using the saved plan path;
    Project Implement continues to `$superpowers-project:implement-plan` using the saved plan path without creating issue mirrors;
    if Use Ready Issue is selected, ask project_plan_issue_execution_route with Resolve Issue, Orchestrate Issues, and Stop. Recommend `Project Implement` for branch-backed non-issue implementation.
    Recommend `Project Issue First` when the GitHub issue backbone is desired. Recommend `Use Ready Issue` only when a compatible ready issue mirror already exists and the plan should route into that execution path.
    If Revisit is selected, use project_plan_review_route and project_plan_review_grill_route with Review First and Revise Plan child routes.
    start the selected next skill in the same turn instead of only telling the user what to prompt next. After every completed action, ask the next native continuation or permission question.
    Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate.
    A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question.
    Final completion must use an explicit final health gate with `Done`, not a `Yes` option.
    Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer.
    Only Stop can break an intermediate loop before a verified final Done gate.
    The agent must not get out of the loop by itself, and ending a turn after a governed workflow action is invalid until the next native continuation or permission question is answered.
    At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized.
    Strict artifact display is mandatory before every closeout or permission question: show what was created or revised, do not merely say something changed, include chosen brainstorm design/specs, full plan tasks and steps,
    created issue bodies or mirrors, full changed-artifact inventory, exact test values/results, cleanup evidence, branch or PR proof, machine-readable ledgers, and when large artifacts are not fully rendered show the path,
    type, action, exact sections changed, representative diff or snippet, and why the full render is omitted. After artifacts are shown, add a separate findings summary with what was done, what was fixed,
    what remains unsatisfactory or risky, the agent's own feedback/opinion, what the agent thinks those results mean, what that means for the active goal, what that means for the broader project context,
    what next steps are now recommended, active-goal impact, broader project impact, and the recommended next route. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?.
    The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route.
    Do not show Continue children beside Revisit and Stop in the same top-level question. Do not show Continue children as peer top-level options.
    Do not compress the top-level Continue? gate and a nested route decision into one prompt, one prose acknowledgement, or one inferred selection.
    If multiple forward or review routes exist, ask the top-level gate first and then the matching nested question. After Yes, ask the nested progress route question when multiple next skills are possible.
    After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate.
    Nested Yes-route menus must not include terminal options and should list only forward routes.
    Nested Revisit-route menus must not include terminal options and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists.
    Recommend Revisit when review, repair, or missing evidence is the next safe action. Stop may be selectable at the top-level gate for user control, but the agent must not recommend Stop before verified final completion.
    Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other never terminates a workflow directly.
    If a custom answer requests `Stop` or `Done`, ask a fresh confirmation question with separate built-in labels instead of terminating from Other;
    otherwise ask the next best child question or baseline nested route and keep the workflow running. Do not infer terminal intent from a custom answer. Review First is not a terminal answer.
    The terminal option must be Stop until a verified final Done gate is reached.
