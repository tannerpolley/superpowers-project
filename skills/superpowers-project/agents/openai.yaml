version: 1
skills:
  superpowers-project:
    default_prompt: "Use $superpowers-project as the Superpowers Project extension router. Route project context and roadmap work to $project-context; brainstorming, specs, PRDs, product design, architecture design, and unresolved early project decisions to $project-brainstorm with superpowers:brainstorming and strict native request_user_input questioning; implementation planning to $project-plan with superpowers:writing-plans; issue decomposition and GitHub issue mirror creation to $project-issue; one ready issue implementation to $project-resolve with native /goal proof; PR or worker-handoff integration to $project-merge with native merge approval, issue close verification, branch/worktree cleanup, prune, cleanup hook, and clean repo proof; and drift audits or migrations to $project-doctor. Canonical artifacts live under docs/superpowers. Use request_user_input when callable for concise Default-mode decisions and start selected continuation routes in the same turn when possible."
