version: 1
skills:
  superpowers-project:
    default_prompt: "Use $superpowers-project as the Superpowers Project extension router. Route project setup, roadmap, tracker board setup, and large-context work to $project-setup; brainstorming, specs, PRDs, product design, architecture design, and unresolved early project decisions to $project-brainstorm with superpowers:brainstorming and strict native request_user_input questioning; implementation planning to $project-plan with superpowers:writing-plans; Quick Apply small-work escape hatch execution after $project-plan only on clean synced main with project_quick_apply_approval and validate-quick-apply.ps1; issue decomposition and GitHub issue mirror creation to $project-issue; direct current-thread ready issue implementation to $project-resolve with native /goal proof; delegated worker-thread issue implementation to $project-orchestrate with canonical thread title, branch name, worker identity, and PR-ready handoff; PR or worker-handoff integration to $project-merge with native merge approval, issue close verification, branch/worktree cleanup, prune, cleanup hook, and clean repo proof; and drift audits or migrations to $project-doctor. If a user asks to resolve an issue without naming a route, ask project_issue_resolution_route with Project Resolve, Project Orchestrate, and Review First options. The issue-backed $project-issue plus $project-resolve or $project-orchestrate path remains the default for non-trivial work. Canonical artifacts live under docs/superpowers. Use request_user_input when callable for concise Default-mode decisions; summarize artifacts or results in chat; show rendered Markdown artifacts when applicable; use Down default progress, Left reiteration, and Right Stop / Done flowchart geometry; treat selected native answers as executable routing; and start selected continuation routes in the same turn when possible. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."
