version: 1
skills:
  project-doctor:
    default_prompt: "Use $project-doctor for Superpowers Project drift audits, migration review, tracker alignment, live plugin sync drift, or repair planning. Run skills/project-doctor/scripts/audit-project.ps1 first with -Mode LocalDocs or -Mode GitHubAware; use -IssueFixturePath, -MilestoneFixturePath, -LabelFixturePath, and -ProjectFixturePath for deterministic smoke tests. Use -TrackerHygiene to inspect GitHub issue routing-label drift and canonical Project V2 state drift, including closed/open status mismatches, missing status:* routing labels on open issues, missing Project items, mirror-to-Project field drift, and remaining Project V2 draft items. Use -ApplyTrackerRepairs only after native approval; its repair_receipt must list each changed GitHub issue label, Project item status, added Project item, and synced Project field. Open issues carry status:* routing labels; closed issues use GitHub closed state plus Project Done and should not keep status:* routing labels. Project V2 draft items are reported separately and are not published, converted, or deleted automatically. Audit docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, specs, plans, issues, GitHub issue mirror fields, GitHub milestone linkage, label vocabulary, retired docs/milestones canonical usage, active goal execution checks, ignored-path traps, native UI contracts, closed mirror lifecycle drift, and live plugin sync drift. Enforce flat canonical roots for spec -> plan -> issue; Milestone pages are index views, nested canonical milestone artifact folders are drift, and only explicitly marked generated index/view output is exempt. Stale closed issue mirrors are repairable drift unless marked Mirror Retention: Keep. Report first, group findings as blocking, repairable, informational, and healthy, require native repair approval before mutation, and make no mutation without user approval. At closeout, summarize the audit or repair result in chat, show rendered Markdown artifacts when applicable, ask project_doctor_next_step with Down Apply Or Prepare Repair, Left Rerun / Review Audit, and Right Stop / Done; use nested repair and review children including Apply Repair, Create Planning Spec, Run Audit Again, and Review First, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."
