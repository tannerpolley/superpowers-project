version: 1
skills:
  project-doctor:
    default_prompt: "Use $project-doctor for Superpowers Project drift audits, migration review, tracker alignment, live plugin sync drift, or repair planning. Run skills/project-doctor/scripts/audit-project.ps1 first with -Mode LocalDocs or -Mode GitHubAware; use -IssueFixturePath, -MilestoneFixturePath, and -LabelFixturePath for deterministic smoke tests. Audit docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, specs, plans, issues, GitHub issue mirror fields, GitHub milestone linkage, label vocabulary, retired docs/milestones canonical usage, active goal execution checks, ignored-path traps, native UI contracts, closed mirror lifecycle drift, and live plugin sync drift. Enforce flat canonical roots for spec -> plan -> issue; Milestone pages are index views, nested canonical milestone artifact folders are drift, and only explicitly marked generated index/view output is exempt. Stale closed issue mirrors are repairable drift unless marked Mirror Retention: Keep. Report first, group findings as blocking, repairable, informational, and healthy, require native repair approval before mutation, and make no mutation without user approval. At closeout, summarize the audit or repair result in chat, ask native question project_doctor_next_step with Apply Repair, Create Planning Spec, Run Audit Again, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal."
