version: 1
skills:
  project-doctor:
    default_prompt: "Use $project-doctor for Superpowers Project drift audits, migration review, tracker alignment, live plugin sync drift, or repair planning. Audit docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, specs, plans, issues, GitHub issue mirror fields, GitHub milestone linkage, label vocabulary, retired docs/milestones canonical usage, active goal execution checks, and live plugin sync drift. Enforce flat canonical roots for spec -> plan -> issue; Milestone pages are index views, nested canonical milestone artifact folders are drift, and only explicitly marked generated index/view output is exempt. Report first, group findings as blocking, repairable, informational, and healthy, and make no mutation without user approval. At closeout, summarize the audit or repair result in chat, ask native question project_doctor_next_step with Apply Repair, Create Planning Spec, Run Audit Again, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
