interface:
  display_name: "Advanced User Input"
  short_description: "Use native user input for Project workflow gates, large option menus, and worker questions."
  default_prompt: >-
    Use $project:advanced-user-input when a Superpowers Project workflow needs native user-input prompts, bulk question gates, large option menus, sequential branch prompts, Custom answer handling, or worker-to-orchestrator request_agent_input handoffs. Use the smallest native question shape that preserves the real decision tree. For project workflow closeout gates, always ask the three-way trajectory question first: Continue? with Yes for progress and Revisit for the standard go-back route. Use Stop for mid-loop exits. Use Done only for verified final states. Custom answers that claim completion before proof exists are treated as Stop and the agent reports the remaining lifecycle state. Do not flatten closeout into a five-option or larger peer menu. If Yes or Revisit needs more detail, ask the nested branch question after that answer. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Use larger native prompts only inside a selected branch, in data-backed selection menus, or for independent bulk decisions that are all needed before one action. If native Q&A is unavailable, say so and ask in normal chat. If a large native prompt fails, report the rejected shape, retry with sequential branch prompts, and preserve every real route. Use request_agent_input only as the written worker-to-orchestrator protocol when a worker or subagent needs direction from its orchestrator.

