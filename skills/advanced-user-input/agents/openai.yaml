interface:
  display_name: "Advanced User Input"
  short_description: "Use native user input for Project workflow gates, large option menus, and worker questions."
  default_prompt: >-
    Use $superpowers-project:advanced-user-input when a Superpowers Project workflow needs native user-input prompts, bulk question gates, large option menus, sequential branch prompts, Custom answer handling, or worker-to-orchestrator request_agent_input handoffs. Use the smallest native question shape that preserves the real decision tree. For project workflow closeout gates, always ask the three-way trajectory question first: Continue? with Yes for progress and Revisit for the standard go-back route. Use Stop for mid-loop exits. Use Done only for verified final states, and only when final proof exists and the repo worktree is clean; Done is invalid whenever git status --short is non-empty. Before any continuation, permission, push, publish, or merge question, complete an artifact review gate. Surface every produced or materially changed artifact with an exact path or identifier. Render human-readable Markdown artifacts when reasonably sized, summarize machine-readable artifacts with their key fields and decisions, and say when an expected artifact type was not produced. After the artifact review gate, add a findings summary that states what the results say, what the agent thinks those results mean, what that means for the active goal, what that means for the broader project context, and what next steps are now recommended. Push, publish, and merge approval questions are invalid until the artifact review gate and findings summary have been shown. If observed behavior conflicts with repo-owned workflow contracts, treat it as a stale-thread recovery case: warn that the loaded thread may still be using older skill text, identify the missed gate or missing route, re-ask that gate natively, and continue from the corrected route instead of treating the skipped step as terminal or implicit approval. Custom answers never terminate directly from Other. If they appear to request Stop or Done, ask a fresh confirmation question instead of terminating from Other. Do not infer terminal intent from ambiguity or a loose completion claim; report the remaining lifecycle state and continue with the next follow-up question instead. Do not flatten closeout into a five-option or larger peer menu. If Yes or Revisit needs more detail, ask the nested branch question after that answer. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when evidence is incomplete, validation failed, or review/repair is the next safe action. Recommend Stop only for explicit mid-loop terminal or blocker states. Recommend Done only at a verified final Done gate. Do not recommend Stop merely because a clean forward route exists, because the current branch is already healthy, or because the original request was narrower than the selected workflow route when the user has not asked to stop. Approval gates use domain-specific decline or cancel labels instead of Stop / Done unless the decline actually ends the workflow. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Use larger native prompts only inside a selected branch, in data-backed selection menus, or for independent bulk decisions that are all needed before one action. If native Q&A is unavailable, say so and ask in normal chat. If a large native prompt fails, report the rejected shape, retry with sequential branch prompts, and preserve every real route. Use request_agent_input only as the written worker-to-orchestrator protocol when a worker or subagent needs direction from its orchestrator.


