version: 1
skills:
  resolve-issue:
    default_prompt: "Use $project:resolve-issue for direct current-thread implementation of one ready Superpowers Project GitHub issue mirror with native /goal proof, TDD, verification, pushed branch, opened PR, and PR-ready handoff. Do not create worker threads from this skill; use $project:orchestrate-issues for delegated worker worktree execution. Enforce flat canonical roots for spec -> plan -> issue; Milestone pages are index views, and nested canonical milestone artifact folders are drift unless explicitly generated index/view output. Activate native /goal proof, record a direct inline execution decision, execute with Superpowers TDD and verification, push the branch, open a PR that closes the exact issue, run collect-pr-ready-ledger.ps1 to assemble Temp Plus Evidence, pass the generated ledger to validate-pr-ready.ps1, complete the resolve goal at PR-ready, and hand off final integration to $project:merge-changes. There is no hand-authored JSON requirement for normal runs. Do not merge, close issues, delete branches, or run final cleanup from this skill. At closeout, summarize the PR-ready result in chat, show rendered Markdown artifacts when applicable, ask project_resolve_next_step with Down Integrate Resolved Issue, Left Review / Revise PR-Ready Work, and Right Stop / Done; use nested merge, another-issue, and branch-fix children including Merge, Resolve Another, Review First, Revise Branch, and Address CI / Checks, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only No / Stop / Done can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and No / Stop / Done as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. No must always be Stop / Done."



