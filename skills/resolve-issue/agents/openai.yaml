version: 1
skills:
  resolve-issue:
    default_prompt: "Use $project:resolve-issue for direct current-thread implementation of one ready Superpowers Project GitHub issue mirror with native /goal proof, TDD, verification, pushed branch, opened PR, and PR-ready handoff. Do not create worker threads from this skill; use $project:orchestrate-issues for delegated worker worktree execution. Enforce flat canonical roots for spec -> plan -> issue; Milestone pages are index views, and nested canonical milestone artifact folders are drift unless explicitly generated index/view output. Activate native /goal proof, record a direct inline execution decision, execute with Superpowers TDD and verification, push the branch, open a PR that closes the exact issue, run collect-pr-ready-ledger.ps1 to assemble Temp Plus Evidence, pass the generated ledger to validate-pr-ready.ps1, complete the resolve goal at PR-ready, and hand off final integration to $project:merge-changes. There is no hand-authored JSON requirement for normal runs. Do not merge, close issues, delete branches, or run final cleanup from this skill. At closeout, summarize the PR-ready result in chat, show rendered Markdown artifacts when applicable, ask project_resolve_next_step with Down Integrate Resolved Issue, Left Review / Revise PR-Ready Work, and Right Stop / Done; use nested merge, another-issue, and branch-fix children including Merge, Resolve Another, Review First, Revise Branch, and Address CI / Checks, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."

