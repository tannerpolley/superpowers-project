interface:
  display_name: "Orchestrate Issues"
  short_description: "Delegate ready issue work to worker worktree threads and collect PR-ready handoff evidence."
  default_prompt: >-
    Use $superpowers-project:orchestrate-issues when a ready Superpowers Project issue should be delegated to a Codex worktree worker thread. Auto Mode requires an Auto Mode authorization ledger from project_auto_mode_authorization validated by the repo-root Auto Mode contract helper with bounded-auto-merge, recorded defaults, issue-backed-orchestrate-only worker routing, and stop outside policy before delegated worker execution without more user input. Validate the issue mirror and source plan, create or verify the orchestrator-owned native goal, derive one canonical worker identity with derive-worker-identity.ps1, create the worker thread from main with matching thread title and branch naming, send a topology handoff, monitor progress, collect PR-ready evidence, and route the finished PR to $superpowers-project:merge-changes. If the target is only a GitHub issue URL, an external intake issue, or Source Plan: TBD, route to $superpowers-project:create-issues hydration first and do not create a worker until the local mirror and source plan exist and mirror validation passes. Do not implement code yourself except for explicitly approved recovery edits. Use request_user_input when callable for route, publish, recovery, merge, or continuation decisions. At closeout, show rendered Markdown artifacts when applicable and ask project_orchestrate_next_step with Down Integrate Worker Output, Left Recover / Review Worker Route, and Right Stop; use nested worker integration and recovery children. Orchestrate can only close out when all owned worktrees have permission to push commits to the open PR or recovery is selected. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Recommend No / Stop / Done only for explicit terminal, blocker, or user-requested stop states. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.
