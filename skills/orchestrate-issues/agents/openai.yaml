interface:
  capabilities: [filesystem.read, filesystem.write, shell, git, subagents, native.user-input, github]
  display_name: "Orchestrate Issues"
  short_description: "Delegate ready issue work to worker worktree threads and collect PR-ready handoff evidence."
  default_prompt: >-
    Use $superpowers-project:orchestrate-issues to delegate one executable leaf issue while the current thread
    reviews and integrates. Read SKILL.md for isolation, worker identity, immutable handoff, companion skills,
    review, merge routing, and Stop conditions.
