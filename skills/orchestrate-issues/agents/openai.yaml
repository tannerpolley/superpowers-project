version: 1
skills:
  orchestrate-issues:
    default_prompt: "Use $project:orchestrate-issues when a ready Superpowers Project issue should be delegated to a Codex worktree worker thread. Validate the issue mirror and source plan, create or verify the orchestrator-owned native goal, derive one canonical worker identity with derive-worker-identity.ps1, create the worker thread from main with matching thread title and branch naming, send a topology handoff, monitor progress, collect PR-ready evidence, and route the finished PR to $project:merge-changes. If the target is only a GitHub issue URL, an external intake issue, or Source Plan: TBD, route to $project:create-issues hydration first and do not create a worker until the local mirror and source plan exist and mirror validation passes. Do not implement code yourself except for explicitly approved recovery edits. Use request_user_input when callable for route, publish, recovery, merge, or continuation decisions. At closeout, show rendered Markdown artifacts when applicable and ask project_orchestrate_next_step with Down Integrate Worker Output, Left Recover / Review Worker Route, and Right Stop / Done; use nested worker integration and recovery children. Orchestrate can only close out when all owned worktrees have permission to push commits to the open PR or recovery is selected. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only No / Stop / Done can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and No / Stop / Done as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. No must always be Stop / Done."



