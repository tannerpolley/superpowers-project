version: 1
skills:
  project-orchestrate:
    default_prompt: "Use $project-orchestrate when a ready Superpowers Project issue should be delegated to a Codex worktree worker thread. Validate the issue mirror and source plan, create or verify the orchestrator-owned native goal, derive one canonical worker identity with derive-worker-identity.ps1, create the worker thread from main with matching thread title and branch naming, send a topology handoff, monitor progress, collect PR-ready evidence, and route the finished PR to $project-merge. Do not implement code yourself except for explicitly approved recovery edits. Use request_user_input when callable for route, publish, recovery, merge, or continuation decisions. At closeout, show rendered Markdown artifacts when applicable and ask project_orchestrate_next_step with Down Integrate Worker Output, Left Recover / Review Worker Route, and Right Stop / Done; use nested worker integration and recovery children. Orchestrate can only close out when all owned worktrees have permission to push commits to the open PR or recovery is selected. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."
