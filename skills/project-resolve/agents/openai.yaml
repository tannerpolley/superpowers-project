version: 1
skills:
  project-resolve:
    default_prompt: "Use $project-resolve to implement one ready GitHub issue mirror under docs/superpowers/issues with a linked source plan under docs/superpowers/plans. Ask the native execution topology question before branch setup: open a worker worktree thread or resolve in the current thread. Activate native /goal proof, record the execution decision, create a Dynamic Work Packet Map for worker mode, execute with Superpowers TDD and verification, push the branch, open a PR that closes the exact issue, run collect-pr-ready-ledger.ps1 to assemble Temp Plus Evidence, pass the generated ledger to validate-pr-ready.ps1, complete the resolve goal at PR-ready, and hand off final integration to $project-merge. There is no hand-authored JSON requirement for normal runs. Do not merge, close issues, delete branches, or run final cleanup from this skill. At closeout, summarize the PR-ready result in chat, ask native question project_resolve_next_step with Project Merge, Resolve Another, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
