interface:
  display_name: "Setup Project"
  short_description: "Set up project context, roadmap, milestones, tracker config, and GitHub project board evidence."
  default_prompt: >-
    Use $superpowers-project:setup-project for Superpowers Project setup, adoption, large-context mapping, milestone pages, GitHub tracker configuration, GitHub Project board setup, native GitHub issue type detection through GraphQL repository.issueTypes and UpdateIssueInput.issueTypeId assignment when available, label-only behavior when GraphQL reports no enabled native issue types, and roadmap repair under docs/superpowers. Maintain docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/agents/project-roadmap.json, and tracker configuration. Enforce flat canonical roots for the spec -> plan -> issue lifecycle: docs/superpowers/specs, docs/superpowers/plans, and docs/superpowers/issues. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes, and treat nested canonical milestone artifact folders are drift unless explicitly generated index/view output. Use request_user_input when callable for roadmap, milestone, GitHub, board creation, or /goal execution policy decisions. At closeout, complete the artifact review gate, inventory every produced or materially changed setup artifact including machine-readable artifacts when present, explain what the results say, what the agent thinks those results mean, what that means for the active goal, what that means for the broader project context, and the recommended next route, show exact artifact paths and links, show rendered Markdown artifacts when applicable, and summarize machine-readable artifacts with exact path plus key fields; ask project_setup_next_step with Yes Continue Project Work, Revisit Revise / Review Setup, and Stop; use nested work, setup-reiteration, and Doctor routes including Brainstorm New Spec, Write Plan, Create Issues, Review Setup, and Run Doctor, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. The agent must not get out of the loop by itself, and ending a turn after a governed workflow action is invalid until the next native continuation or permission question is answered. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. Do not compress the top-level Continue? gate and a nested route decision into one prompt, one prose acknowledgement, or one inferred selection. If multiple forward or review routes exist, ask the top-level gate first and then the matching nested question. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Stop may be selectable at the top-level gate for user control, but the agent must not recommend Stop before verified final completion. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other never terminates a workflow directly. If it appears to ask for Stop or Done, ask a fresh confirmation question instead of terminating from Other; otherwise ask the next best child question or baseline nested route and keep the workflow running. Do not infer terminal intent from a custom answer. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.


