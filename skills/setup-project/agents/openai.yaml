interface:
  display_name: "Setup Project"
  short_description: "Set up project context, roadmap, milestones, tracker config, and GitHub project board evidence."
  default_prompt: >-
    Use $project:setup-project for Superpowers Project setup, adoption, large-context mapping, milestone pages, GitHub tracker configuration, GitHub Project board setup, and roadmap repair under docs/superpowers. Maintain docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/agents/project-roadmap.json, and tracker configuration. Enforce flat canonical roots for the spec -> plan -> issue lifecycle: docs/superpowers/specs, docs/superpowers/plans, and docs/superpowers/issues. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes, and treat nested canonical milestone artifact folders are drift unless explicitly generated index/view output. Use request_user_input when callable for roadmap, milestone, GitHub, board creation, or /goal execution policy decisions. At closeout, summarize the setup result in chat, show rendered Markdown artifacts when applicable, ask project_setup_next_step with Down Continue Project Work, Left Revise / Review Setup, and Right Stop / Done; use nested work, existing-artifact, setup-reiteration, and Doctor routes including Brainstorm, Plan, Create Issue, Review Setup, and Run Doctor, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only No / Stop / Done can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and No / Stop / Done as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. No must always be Stop / Done.

