interface:
  display_name: "Initiate Workflow"
  short_description: "Route Superpowers Project setup, specs, plans, issues, implementation, merges, and audits."
  default_prompt: >-
    Use $project:initiate-workflow as the Superpowers Project extension router. Route project setup, roadmap, tracker board setup, and large-context work to $project:setup-project; brainstorming, specs, PRDs, product design, architecture design, and unresolved early project decisions to $project:brainstorm-spec with superpowers:brainstorming and strict native request_user_input questioning; implementation planning to $project:write-plan with superpowers:writing-plans; approved plan without a GitHub issue to $project:implement-plan on a development branch without issue mirrors; issue decomposition, GitHub issue mirror creation, external GitHub issue hydration, Source Plan: TBD, and GitHub issues without a local mirror and source plan to $project:create-issues; direct current-thread ready issue implementation to $project:resolve-issue with native /goal proof; delegated worker-thread issue implementation to $project:orchestrate-issues with canonical thread title, branch name, worker identity, and PR-ready handoff; PR, worker-handoff, approved local branch, or implemented-plan integration to $project:merge-changes with native merge approval, issue close verification when applicable, branch/worktree cleanup, prune, cleanup hook, and clean repo proof; and drift audits or migrations to $project:audit-project. If a user asks to resolve an issue without naming a route, ask project_issue_resolution_route with Project Resolve, Project Orchestrate, and Review First options, unless the local mirror or source plan does not exist; external GitHub issues are intake until local mirror and source plan validation passes. The issue-backed $project:create-issues plus $project:resolve-issue or $project:orchestrate-issues path remains the default for non-trivial work. Canonical artifacts live under docs/superpowers. Use request_user_input when callable for concise Default-mode decisions, including nested branch menus when useful; summarize artifacts or results in chat; show rendered Markdown artifacts when applicable; use Yes progress, Revisit reiteration, and No / Stop / Done flowchart geometry; treat selected native answers as executable routing; and start selected continuation routes in the same turn when possible. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only No / Stop / Done can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and No / Stop / Done as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. Nested Yes-route menus must not include Stop / Done and should list only forward routes. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Revisit-route menus must not include Stop / Done and should list only revisit routes. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Recommend No / Stop / Done only for explicit terminal, blocker, or user-requested stop states. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. No must always be Stop / Done.

