interface:
  display_name: "Initiate Workflow"
  short_description: "Route Superpowers Project setup, specs, plans, issues, implementation, merges, and audits."
  default_prompt: >-
    Use $superpowers-project:initiate-workflow as the Superpowers Project extension router. Route project setup, roadmap, tracker board setup, and large-context work to $superpowers-project:setup-project; brainstorming, specs, PRDs, product design, architecture design, and unresolved early project decisions to $superpowers-project:brainstorm-spec with superpowers:brainstorming and strict native request_user_input questioning; implementation planning to $superpowers-project:write-plan with superpowers:writing-plans; approved plan without a GitHub issue to $superpowers-project:implement-plan on a development branch without issue mirrors; issue decomposition, GitHub issue mirror creation, external GitHub issue hydration, Source Plan: TBD, and GitHub issues without a local mirror and source plan to $superpowers-project:create-issues; direct current-thread ready issue implementation to $superpowers-project:resolve-issue with native /goal proof; delegated worker-thread issue implementation to $superpowers-project:orchestrate-issues with canonical thread title, branch name, worker identity, and PR-ready handoff; PR, worker-handoff, approved local branch, or implemented-plan integration to $superpowers-project:merge-changes with native merge approval, issue close verification when applicable, branch/worktree cleanup, prune, cleanup hook, and clean repo proof; and drift audits or migrations to $superpowers-project:audit-project. Routing is not complete until the paired Superpowers companion method is also enforced: brainstorm-spec with superpowers:brainstorming, write-plan with superpowers:writing-plans, implement-plan with superpowers:executing-plans plus required TDD/debug/verification companions, create-issues with downstream resolve/orchestrate method compatibility, resolve-issue with using-git-worktrees plus executing-plans plus TDD/debug/verification plus finishing-a-development-branch, orchestrate-issues with subagent-driven-development plus the worker companion skill set, and merge-changes with finishing-a-development-branch plus upstream verification-before-completion proof. Do not treat those pairings as optional guidance. If a user asks to resolve an issue without naming a route, ask project_issue_resolution_route with Project Resolve, Project Orchestrate, and Review First options, unless the local mirror or source plan does not exist; external GitHub issues are intake until local mirror and source plan validation passes. The issue-backed $superpowers-project:create-issues plus $superpowers-project:resolve-issue or $superpowers-project:orchestrate-issues path remains the default for non-trivial work. After $superpowers-project:brainstorm-spec saves a spec, Auto Mode is authorized only through project_auto_mode_authorization with Bounded Auto Merge; record an Auto Mode authorization ledger validated by the repo-root Auto Mode contract helper, then choose planning, issue-backed orchestration, direct plan implementation, verification, merge, and closeout proof within recorded defaults, and stop outside policy when proof, validation, GitHub state, or decision scope is outside the ledger. Canonical artifacts live under docs/superpowers. Use request_user_input when callable for concise Default-mode decisions, including nested branch menus when useful; complete the artifact review gate before closeout; inventory produced or materially changed artifacts including machine-readable artifacts when present; show exact artifact paths and links; show rendered Markdown artifacts when applicable; explain what the results say, what the agent thinks those results mean, what that means for the active goal, what that means for the broader project context, and the recommended next route; use Yes default progress, Revisit reiteration, and Stop terminal flowchart geometry; treat selected native answers as executable routing; and start selected continuation routes in the same turn when possible. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. The agent must not get out of the loop by itself, and ending a turn after a governed workflow action is invalid until the next native continuation or permission question is answered. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized, and summarize machine-readable artifacts with exact path plus key fields. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. Do not compress the top-level Continue? gate and a nested route decision into one prompt, one prose acknowledgement, or one inferred selection. If multiple forward or review routes exist, ask the top-level gate first and then the matching nested question. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Stop may be selectable at the top-level gate for user control, but the agent must not recommend Stop before verified final completion. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other never terminates a workflow directly. If it appears to ask for Stop or Done, ask a fresh confirmation question instead of terminating from Other; otherwise ask the next best child question or baseline nested route and keep the workflow running. Do not infer terminal intent from a custom answer. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.



