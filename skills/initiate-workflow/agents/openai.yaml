version: 1
skills:
  initiate-workflow:
    default_prompt: "Use $project:initiate-workflow as the Superpowers Project extension router. Route project setup, roadmap, tracker board setup, and large-context work to $project:setup-project; brainstorming, specs, PRDs, product design, architecture design, and unresolved early project decisions to $project:brainstorm-spec with superpowers:brainstorming and strict native request_user_input questioning; implementation planning to $project:write-plan with superpowers:writing-plans; Quick Apply small-work escape hatch execution after $project:write-plan only on clean synced main with project_quick_apply_approval and validate-quick-apply.ps1; issue decomposition, GitHub issue mirror creation, external GitHub issue hydration, Source Plan: TBD, and GitHub issues without a local mirror and source plan to $project:create-issues; direct current-thread ready issue implementation to $project:resolve-issue with native /goal proof; delegated worker-thread issue implementation to $project:orchestrate-issues with canonical thread title, branch name, worker identity, and PR-ready handoff; PR or worker-handoff integration to $project:merge-changes with native merge approval, issue close verification, branch/worktree cleanup, prune, cleanup hook, and clean repo proof; and drift audits or migrations to $project:audit-project. If a user asks to resolve an issue without naming a route, ask project_issue_resolution_route with Project Resolve, Project Orchestrate, and Review First options, unless the local mirror or source plan does not exist; external GitHub issues are intake until local mirror and source plan validation passes. The issue-backed $project:create-issues plus $project:resolve-issue or $project:orchestrate-issues path remains the default for non-trivial work. Canonical artifacts live under docs/superpowers. Use request_user_input when callable for concise Default-mode decisions; summarize artifacts or results in chat; show rendered Markdown artifacts when applicable; use Down default progress, Left reiteration, and Right Stop / Done flowchart geometry; treat selected native answers as executable routing; and start selected continuation routes in the same turn when possible. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."



