version: 1
skills:
  project-issue:
    default_prompt: "Use $project-issue when a Superpowers Project spec, plan, PRD, or approved scope needs vertical slices published as GitHub issues and synced mirrors. Read docs/superpowers/specs, docs/superpowers/plans, docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/superpowers/issues, and tracker label vocabulary from docs/agents when present; classify each slice as AFK or HITL; capture Blocked by relationships, Acceptance Criteria, GitHub Issue, GitHub Milestone, configured type/status labels, proof oracle, Goal Command for AFK issues, Execution Mode, Worktree Policy, Integration Policy, TDD Policy, Parallelization Plan, Reviewer Role, and Script Gate Mode; include a Project Merge section with Merge Owner, Merge Gate, Merge Policy, Worktree Cleanup Policy, and Orchestrator Wakeup Policy; write mirrors under docs/superpowers/issues; validate mirrors before handoff. At closeout, summarize the issue set in chat, ask native question project_issue_next_step with Resolve First Ready, Resolve Selected, Review First, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
