version: 1
skills:
  project-issue:
    default_prompt: "Use $project-issue when a Superpowers Project spec, plan, PRD, approved scope, or external GitHub issue hydration request needs vertical slices published as GitHub issues and synced mirrors. Read docs/superpowers/specs, docs/superpowers/plans, docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/superpowers/issues, and tracker label vocabulary from docs/agents when present; keep flat canonical roots for spec -> plan -> issue; classify each slice as AFK or HITL; capture Blocked by relationships, Acceptance Criteria, GitHub Issue, GitHub Milestone, configured type/status labels, proof oracle, Goal Command for AFK issues, Execution Mode, Worktree Policy, Integration Policy, TDD Policy, Parallelization Plan, Reviewer Role, and Script Gate Mode; include a Project Merge section with Merge Owner, Merge Gate, Merge Policy, Worktree Cleanup Policy, and Orchestrator Wakeup Policy; write mirrors under docs/superpowers/issues, where issue mirrors include the GitHub issue number after publication; for Source Plan: TBD or GitHub issues without local artifacts, run hydrate-external-issue.ps1 to create or update the local mirror and source plan before routing; external GitHub issues are intake until local mirror and source plan validation passes; treat Milestone pages are index views and nested canonical milestone artifact folders are drift; validate mirrors before handoff. At closeout, summarize the issue set in chat, show rendered Markdown artifacts when applicable, ask project_issue_next_step with Down Continue Issue Execution, Left Revise / Review Issues, and Right Stop / Done; use nested resolve, orchestrate, and issue-reiteration children including Resolve First Ready, Resolve Selected, Review First, and Repair Issue Mirrors, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."
