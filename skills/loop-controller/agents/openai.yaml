interface:
  capabilities: [filesystem.read, filesystem.write, shell, native.user-input]
  display_name: "Loop Controller"
  short_description: "Coordinate repeated Superpowers Project workflow runs with run ledgers, budgets, verifier proof, and native gates."
  default_prompt: >-
    Use $superpowers-project:loop-controller for bounded repeated maintenance across ready candidates in Looping
    Mode. Read SKILL.md for run ledgers, budget ledgers, candidate inventory, verifier proof, metrics, and terminal
    closeout; resolve plugin-owned validators and docs from the loaded Superpowers Project plugin root, not from
    the active target repo, and read docs/superpowers/workflow-contract.yml for route question ids and options. Generated state lives
    under .superpowers/runs and is not canonical committed backlog. Select one candidate at a time, validate budget
    and run ledgers, route actual work to the owning skill, then ask the next native continuation or final health
    gate.
