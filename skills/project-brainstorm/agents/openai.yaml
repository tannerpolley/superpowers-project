version: 1
skills:
  project-brainstorm:
    default_prompt: "Use $project-brainstorm for repo-backed ideas, specs, PRDs, architecture concepts, or broad feature requests. Use superpowers:brainstorming as the base workflow, inspect docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, relevant docs, and code before asking; use request_user_input in Default mode for any unresolved brainstorming decision when callable; carry grill-me wording and pressure into assumption checks; report evidence, decision points, and assumptions to remove; save loose specs under docs/superpowers/specs in flat canonical roots. Specs use docs/superpowers/specs/<yyyy-mm-dd>-<slug>.md; milestone identity is optional, and milestone/category views use frontmatter plus milestone indexes because Milestone pages are index views. Treat nested canonical milestone artifact folders are drift. Route product-shaped work through to-prd behavior and architecture-heavy work through improve-codebase-architecture behavior. At closeout, summarize the artifact in chat, ask native question project_brainstorm_next_step with Project Plan, Review First, Revise Spec, and Stop options, then start the selected next skill in the same turn when tools and state allow it."
