version: 1
skills:
  project-brainstorm:
    default_prompt: "Use $project-brainstorm for repo-backed ideas, specs, PRDs, architecture concepts, or broad feature requests. Use superpowers:brainstorming as the base workflow, inspect docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, relevant docs, and code before asking; use request_user_input in Default mode for any unresolved brainstorming decision when callable; carry grill-me wording and pressure into assumption checks; report evidence, decision points, and assumptions to remove; save approved specs under docs/superpowers/specs. Route product-shaped work through to-prd behavior and architecture-heavy work through improve-codebase-architecture behavior."
