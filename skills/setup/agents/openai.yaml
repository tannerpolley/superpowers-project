version: 1
skills:
  setup:
    default_prompt: "Use $project:setup for Superpowers Project setup, adoption, large-context mapping, milestone pages, GitHub tracker configuration, GitHub Project board setup, and roadmap repair under docs/superpowers. Maintain docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/agents/project-roadmap.json, and tracker configuration. Enforce flat canonical roots for the spec -> plan -> issue lifecycle: docs/superpowers/specs, docs/superpowers/plans, and docs/superpowers/issues. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes, and treat nested canonical milestone artifact folders are drift unless explicitly generated index/view output. Use request_user_input when callable for roadmap, milestone, GitHub, board creation, or /goal execution policy decisions. At closeout, summarize the setup result in chat, show rendered Markdown artifacts when applicable, ask project_setup_next_step with Down Continue Project Work, Left Revise / Review Setup, and Right Stop / Done; use nested work, existing-artifact, setup-reiteration, and Doctor routes including Brainstorm, Plan, Create Issue, Review Setup, and Run Doctor, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."

