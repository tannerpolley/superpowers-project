interface:
  display_name: "Implement Plan"
  short_description: "Implement an approved plan on a development branch without issue mirrors."
  default_prompt: >-
    Use $superpowers-project:implement-plan when an approved plan under `docs/superpowers/plans` should be implemented without creating a GitHub issue. This route is the non-issue adapter for superpowers:executing-plans. Require superpowers:executing-plans as the base method, require superpowers:test-driven-development for feature and bug work unless the approved plan records an explicit opt-out, require superpowers:systematic-debugging or diagnose for bugs, regressions, CI failures, performance work, or unclear failure modes, require superpowers:verification-before-completion before any success claim, commit, or local merge, and require superpowers:subagent-driven-development whenever worker topology is selected. Do not treat those companion skills as optional suggestions. This route does not create issue mirrors, must not open pull requests, and must not claim GitHub issue closure. Require native `/goal` activation, a development branch, request_user_input for implement_plan_topology when callable, or an Auto Mode authorization ledger from project_auto_mode_authorization validated by the repo-root Auto Mode contract helper with bounded-auto-merge, recorded defaults, preauthorized-after-clean-premerge, and stop outside policy, the approved plan proof oracle, cleanup evidence, implement_plan_push_permission with push-branch or hold only, explicit branch push proof before merge-ready output, and merge-ready output routed to merge-changes in local-branch mode. Before asking push permission, complete the artifact review gate, show verification evidence, explain what the results mean for the active goal and broader project context, and state the recommended next route. Do not ask for push approval first and explain later. Pull request routes are allowed only for issue-backed work with a companion issue mirror. Only use worker mode when the worker handoff names the orchestrator, role, plan path, branch, reporting path, and request_agent_input boundary. At closeout, complete the artifact review gate, inventory every produced or materially changed artifact owned by the implementation run, summarize the branch result in chat, explain what the results mean for the active goal and broader project context, state the recommended next route, show exact artifact paths and links, show rendered Markdown artifacts when applicable, and summarize machine-readable artifacts with exact path plus key fields. Ask project_implement_next_step with Yes Merge Implemented Plan, Revisit Revise / Review Branch, and Stop; use nested branch revision and evidence review children, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A local merge, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. The agent must not get out of the loop by itself, and ending a turn after a governed workflow action is invalid until the next native continuation or permission question is answered. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. Do not compress the top-level Continue? gate and a nested route decision into one prompt, one prose acknowledgement, or one inferred selection. If multiple forward or review routes exist, ask the top-level gate first and then the matching nested question. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Stop may be selectable at the top-level gate for user control, but the agent must not recommend Stop before verified final completion. Do not recommend Stop merely because the branch is clean, validated, or already pushed when merge-ready routing is the authorized next step and the user has not asked to stop. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other never terminates a workflow directly. If it appears to ask for Stop or Done, ask a fresh confirmation question instead of terminating from Other; otherwise ask the next best child question or baseline nested route and keep the workflow running. Do not infer terminal intent from a custom answer. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.



