interface:
  display_name: "Implement Plan"
  short_description: "Implement an approved plan on a development branch without issue mirrors."
  default_prompt: >-
    Use $project:implement-plan when an approved plan under `docs/superpowers/plans` should be implemented without creating a GitHub issue. This route does not create issue mirrors and must not claim GitHub issue closure. Require native `/goal` activation, a development branch, request_user_input for implement_plan_topology when callable, superpowers:test-driven-development, superpowers:executing-plans, superpowers:verification-before-completion, the approved plan proof oracle, cleanup evidence, implement_plan_publish_permission, and merge-ready output routed to merge-changes or another approved merge route. Use pr-no-issue merge-ready evidence for pushed PRs. Only use worker mode when the worker handoff names the orchestrator, role, plan path, branch, reporting path, and request_agent_input boundary. At closeout, summarize the branch result in chat, show rendered Markdown artifacts when applicable, ask project_implement_next_step with Down Merge Implemented Plan, Left Revise / Review Branch, and Right Stop / Done; use nested branch revision and evidence review children, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only No / Stop / Done can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and No / Stop / Done as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. No must always be Stop / Done.

