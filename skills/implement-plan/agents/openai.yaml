interface:
  capabilities: [filesystem.read, filesystem.write, shell, git, goals, native.user-input, subagents]
  display_name: "Implement Plan"
  short_description: "Implement an approved plan on a development branch without issue mirrors."
  default_prompt: >-
    Use $superpowers-project:implement-plan for approved branch-backed work without issue mirrors. Read SKILL.md for
    companion methods, goal and workspace setup, proof, publication approval, merge handoff, and Stop behavior.
    Use docs/superpowers/workflow-contract.yml for route options.
