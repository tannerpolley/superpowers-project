version: 1
skills:
  implement-plan:
    default_prompt: "Use $project:implement-plan when an approved plan under `docs/superpowers/plans` should be implemented without creating a GitHub issue. This route does not create issue mirrors and must not claim GitHub issue closure. Require native `/goal` activation, a development branch, request_user_input for implement_plan_topology when callable, superpowers:test-driven-development, superpowers:executing-plans, superpowers:verification-before-completion, the approved plan proof oracle, cleanup evidence, implement_plan_publish_permission, and merge-ready output routed to merge-changes or another approved merge route. Use pr-no-issue merge-ready evidence for pushed PRs. Only use worker mode when the worker handoff names the orchestrator, role, plan path, branch, reporting path, and request_agent_input boundary. At closeout, summarize the branch result in chat, show rendered Markdown artifacts when applicable, ask project_implement_next_step with Down Merge Implemented Plan, Left Revise / Review Branch, and Right Stop / Done; use nested branch revision and evidence review children, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Left is non-terminal. Down must start the selected progress route or ask its blocking child question; the only Down terminal exception is an explicit final Healthy -> Done gate. Left must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Right `Stop / Done` can break the loop before that final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires, including more than three peer options or independent questions when useful; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer; show evidence or rendered artifacts, ask follow-up questions, and return to the originating continuation gate. Right must always be Stop / Done."

