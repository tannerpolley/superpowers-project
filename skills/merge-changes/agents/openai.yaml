interface:
  display_name: "Merge Changes"
  short_description: "Merge PR-ready or branch-ready work with approvals, cleanup, and closeout proof."
  default_prompt: >-
    Use $superpowers-project:merge-changes when a Superpowers Project PR URL or worker handoff, or an approved local branch, is ready for main-thread integration. Auto Mode requires an Auto Mode authorization ledger from project_auto_mode_authorization validated by the repo-root Auto Mode contract helper with bounded-auto-merge, recorded defaults, preauthorized-after-clean-premerge, and stop outside policy; clean premerge proof satisfies merge approval before merging without more user input. Support merge_mode values pr-issue, pr-no-issue, and local-branch. In pr-issue mode, read the linked issue mirror, source plan, setup ledger, and PR-ready handoff; require exact PR issue closure, linked issue closeout, mirror cleanup, and milestone closed-summary proof. In pr-no-issue mode, require source plan linkage, PR checks, native approval, branch/worktree cleanup, prune proof, cleanup hook proof, and clean repo proof, but block any issue closure claim. In local-branch mode, require source plan linkage, clean synced main proof, validation proof, native merge approval, local merge proof, branch/worktree cleanup, prune proof, cleanup hook proof, and clean repo proof. Run collect-premerge-ledger.ps1 when assembling PR Temp Plus Evidence and pass the generated ledger to premerge.ps1; ask native request_user_input question project_merge_approval with Merge and Decline options before merging; merge only after approval; sync default; delete only the owned branch; remove the owned worktree; run git fetch --prune and the repo cleanup hook; then run closeout.ps1 with mode-specific evidence. If approval is declined, use advanced-user-input for User Review, Reassess Plan, or Reassess Spec; use request_agent_input instead when a worker/subagent must ask its orchestrator. There is no hand-authored JSON requirement for normal runs. At closeout, summarize the merge result in chat, show rendered Markdown artifacts when applicable, Done is valid only at a verified final Done gate after clean closeout proof; project_merge_final_health_gate asks Done, Revisit, or Stop, and Stop remains terminal when premerge or closeout proof is incomplete. Ask project_merge_next_step with Down Continue Project Execution, Left Review / Repair Closeout, and Right Stop; use nested issue, planning, repair, and cleanup children including Resolve Another, Orchestrate Another, Review Closeout, Run Doctor, Reassess Plan, Reassess Spec, and Re-run Cleanup, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.



