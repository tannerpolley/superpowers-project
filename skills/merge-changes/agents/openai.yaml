version: 1
skills:
  merge-changes:
    default_prompt: "Use $project:merge-changes when a Superpowers Project PR URL or worker handoff, or an approved local branch, is ready for main-thread integration. Support merge_mode values pr-issue, pr-no-issue, and local-branch. In pr-issue mode, read the linked issue mirror, source plan, setup ledger, and PR-ready handoff; require exact PR issue closure, linked issue closeout, mirror cleanup, and milestone closed-summary proof. In pr-no-issue mode, require source plan linkage, PR checks, native approval, branch/worktree cleanup, prune proof, cleanup hook proof, and clean repo proof, but block any issue closure claim. In local-branch mode, require source plan linkage, clean synced main proof, validation proof, native merge approval, local merge proof, branch/worktree cleanup, prune proof, cleanup hook proof, and clean repo proof. Run collect-premerge-ledger.ps1 when assembling PR Temp Plus Evidence and pass the generated ledger to premerge.ps1; ask native request_user_input question project_merge_approval with Merge and Decline options before merging; merge only after approval; sync default; delete only the owned branch; remove the owned worktree; run git fetch --prune and the repo cleanup hook; then run closeout.ps1 with mode-specific evidence. If approval is declined, use advanced-user-input for User Review, Reassess Plan, or Reassess Spec; use request_agent_input instead when a worker/subagent must ask its orchestrator. There is no hand-authored JSON requirement for normal runs. At closeout, summarize the merge result in chat, show rendered Markdown artifacts when applicable, ask project_merge_next_step with Down Continue Project Execution, Left Review / Repair Closeout, and Right Stop / Done; use nested issue, planning, repair, and cleanup children including Resolve Another, Orchestrate Another, Review Closeout, Run Doctor, Reassess Plan, Reassess Spec, and Re-run Cleanup, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: Down is default progress, Left is reiteration such as revise/review/repair/rerun/recover, and Right is Stop / Done. Use as many native questions and options as the decision requires; show all real peer routes when clearer, and use advanced-user-input sequential branching when one answer changes the follow-up questions. Custom Other is terminal only when it explicitly asks to stop or be done; otherwise ask the next best child question or baseline nested route. Right must always be Stop / Done."

