interface:
  display_name: "Companion Interface"
  short_description: "Create Superpowers Project Agent-Native visual-plan and visual-recap MDX review artifacts."
  default_prompt: >-
    Use $superpowers-project:companion-interface for optional Agent-Native visual-plan or visual-recap review
    surfaces that complement, but do not replace, native chat/request_user_input approvals. Read SKILL.md for
    local-files mode, preview boundaries, and approval limits; read docs/superpowers/workflow-contract.yml for where
    companion output can attach to brainstorm, plan, or merge routes. Do not treat visual assets as permission to
    mutate, publish, push, or merge.
