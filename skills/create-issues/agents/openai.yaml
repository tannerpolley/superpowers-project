interface:
  capabilities: [filesystem.read, filesystem.write, shell, github, native.user-input]
  display_name: "Create Issues"
  short_description: "Create GitHub issue mirrors and published issues from approved plans or specs."
  default_prompt: >-
    Use $superpowers-project:create-issues to turn approved scope into executable GitHub issue slices and local
    mirrors. Read SKILL.md for hierarchy, mirror schema, publication approval, validation, project_issue_next_step,
    and Stop behavior. Use the workflow contract for route options.
