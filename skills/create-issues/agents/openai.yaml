interface:
  display_name: "Create Issues"
  short_description: "Create GitHub issue mirrors and published issues from approved plans or specs."
  default_prompt: >-
    Use $superpowers-project:create-issues when a Superpowers Project spec, plan, PRD, approved scope, or external GitHub issue hydration request needs vertical slices published as GitHub issues and synced mirrors. Auto Mode requires an Auto Mode authorization ledger from project_auto_mode_authorization validated by the repo-root Auto Mode contract helper with bounded-auto-merge, recorded defaults, issue-backed-orchestrate-only worker routing, and stop outside policy before issue publication or execution handoff without more user input. Read docs/superpowers/specs, docs/superpowers/plans, docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/superpowers/issues, and tracker label vocabulary from docs/agents when present; keep flat canonical roots for spec -> plan -> issue; classify each slice as AFK or HITL; capture Blocked by relationships, Acceptance Criteria, GitHub Issue, GitHub Milestone, configured type/status labels, proof oracle, Goal Command for AFK issues, Execution Mode, Worktree Policy, Integration Policy, TDD Policy, Parallelization Plan, Reviewer Role, and Script Gate Mode; include a Project Merge section with Merge Owner, Merge Gate, Merge Policy, Worktree Cleanup Policy, and Orchestrator Wakeup Policy; write mirrors under docs/superpowers/issues, where issue mirrors include the GitHub issue number after publication; keep downstream routing compatible with the mandatory Superpowers companion skills enforced by $superpowers-project:resolve-issue and $superpowers-project:orchestrate-issues; for Source Plan: TBD or GitHub issues without local artifacts, run hydrate-external-issue.ps1 to create or update the local mirror and source plan before routing; external GitHub issues are intake until local mirror and source plan validation passes; treat Milestone pages are index views and nested canonical milestone artifact folders are drift; validate mirrors before handoff. At closeout, complete the artifact review gate, inventory every produced or materially changed artifact owned by the issue-publication run, summarize the issue set in chat, explain what the results mean for the active goal and broader project context, and state the recommended next route. Show exact artifact paths and links, show rendered Markdown artifacts when applicable, and summarize machine-readable artifacts with exact path plus key fields. Ask project_issue_next_step with Down Continue Issue Execution, Left Revise / Review Issues, and Right Stop; use nested resolve, orchestrate, and issue-reiteration children including Resolve First Ready, Resolve Selected, Review First, and Repair Issue Mirrors, then start the selected next skill in the same turn when tools and state allow it. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop through native continuation input or reaches a verified final Done gate. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal. Revisit is non-terminal. Yes must start the selected progress route or ask its blocking child question; the only Yes terminal exception is an explicit final Healthy -> Done gate. Revisit must show/review/repair/gather evidence, ask follow-up questions when needed, and return to the originating continuation gate. Review First is not a terminal answer. Only Stop can break an intermediate loop before a verified final Done gate. At closeout, show exact artifact paths and links and show rendered Markdown artifacts when newly created or changed Markdown is reasonably sized. Use flowchart geometry for native continuation: the top-level closeout question must be asked as Continue?. The top-level closeout question must use exactly three trajectory options: Yes for progress, Revisit for the standard go-back route, and Stop as the normal terminal route. Do not show Continue children beside Revisit and No in the same top-level question. Do not show Continue children as peer top-level options. Do not compress the top-level Continue? gate and a nested route decision into one prompt, one prose acknowledgement, or one inferred selection. If multiple forward or review routes exist, ask the top-level gate first and then the matching nested question. After Yes, ask the nested progress route question when multiple next skills are possible. After Revisit, show evidence or rendered artifacts, ask the nested review/revision question when needed, and return to the originating continuation gate. Nested Yes-route menus must not include Stop / Done and should list only forward routes. Nested Revisit-route menus must not include Stop / Done and should list only revisit, repair, rerun, recovery, review, or evidence routes. Recommend Yes when at least one safe forward route exists. Recommend Revisit when review, repair, or missing evidence is the next safe action. Recommend Stop only for explicit mid-loop terminal or blocker states. Recommend Done only at a verified final Done gate. Nested branch questions and independent bulk gates may use as many native questions or options as the decision requires. Custom Other never terminates a workflow directly. If it appears to ask for Stop or Done, ask a fresh confirmation question instead of terminating from Other; otherwise ask the next best child question or baseline nested route and keep the workflow running. Do not infer terminal intent from a custom answer. Review First is not a terminal answer. The terminal option must be Stop until a verified final Done gate is reached.



