interface:
  display_name: "Create Issues"
  short_description: "Create GitHub issue mirrors and published issues from approved plans or specs."
  default_prompt: >-
    Use $superpowers-project:create-issues to decompose approved specs or plans into GitHub issues and synced
    mirrors under docs/superpowers/issues. Read SKILL.md for mirror schema, tracker metadata, and native gates; read
    docs/superpowers/workflow-contract.yml for route question ids and options. Create vertical slices with flat
    canonical roots; issue mirrors include the GitHub issue number. missing or malformed workflow metadata is blocking for every issue mirror.
    For hierarchy modes, support flat, issue-set, and sub-milestone publication; require a dry command receipt and read SKILL.md for hierarchy route details.
    Outcome Summary requires Outcome Source, Interface, Cutover, and Stop Criteria. For external GitHub issue hydration,
    use hydrate-external-issue.sh; Source Plan: TBD means intake only until a local mirror and source plan exist.
    summarize artifact review gate status, broader project context, recommended next route, and machine-readable
    artifacts. project_issue_next_step is the top-level continuation gate; use SKILL.md and docs/superpowers/workflow-contract.yml
    for resolve, orchestrate, and review child routes before starting the selected next skill.
    keep downstream routing compatible with the mandatory Superpowers companion skills enforced by $superpowers-project:resolve-issue and $superpowers-project:orchestrate-issues.
    Use request_user_input for execution route and issue count decisions.
