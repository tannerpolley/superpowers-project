version: 1
skills:
  project-plan:
    default_prompt: "Use $project-plan when an approved Superpowers Project spec or issue mirror needs an implementation plan. Use superpowers:writing-plans as the base workflow, save plans under docs/superpowers/plans, link docs/superpowers/specs and docs/superpowers/issues when present, use request_user_input in Default mode for material choices, require proof oracle evidence, require superpowers:test-driven-development for feature or bug plans unless explicit opt-out, require superpowers:systematic-debugging for bugs, and require superpowers:verification-before-completion before completion. After saving and self-reviewing the plan, summarize the plan in chat, ask native question project_plan_next_step with Project Issue First, Quick Apply, Review First, Revise Plan, and Stop options, then start the selected next skill in the same turn instead of only telling the user what to prompt next. Quick Apply is only for small, low-risk work on clean synced `main`; before edits ask project_quick_apply_approval with Apply on Main, Use Issue Flow, and Stop options, record selected_action: apply only for Apply on Main, and validate with skills/project-plan/scripts/validate-quick-apply.ps1 requiring verification commands, cleanup hook evidence, and explicit push approval before any push."
