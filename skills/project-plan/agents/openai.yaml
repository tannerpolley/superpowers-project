version: 1
skills:
  project-plan:
    default_prompt: "Use $project-plan when an approved Superpowers Project spec or issue mirror needs an implementation plan. Use superpowers:writing-plans as the base workflow, save plans under docs/superpowers/plans in flat canonical roots, link one or more loose specs or a raw approved idea plus docs/superpowers/issues when present, and keep the lifecycle spec -> plan -> issue. plans include creation date and milestone identity where applicable, for example docs/superpowers/plans/<yyyy-mm-dd>-<milestone-or-category>-<slug>-plan.md. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes and treat nested canonical milestone artifact folders are drift. Before saving a plan, use the Planning Grill Gate: apply grill-me behavior, inspect knowable context first, and use request_user_input in Default mode as a hard gate for material scope, acceptance criteria, sequencing, proof oracle, TDD policy, branch strategy, routing, publish behavior, or live mutation choices. Do not present a plan as ready until material decisions have been answered or explicitly deferred with a named risk owner. Require proof oracle evidence, require superpowers:test-driven-development for feature or bug plans unless explicit opt-out, require superpowers:systematic-debugging for bugs, and require superpowers:verification-before-completion before completion. After saving and self-reviewing the plan, summarize the plan in chat, ask native question project_plan_next_step with Project Issue First, Quick Apply, Review First, Revise Plan, and Stop options, then start the selected next skill in the same turn instead of only telling the user what to prompt next. Quick Apply is only for small, low-risk work on clean synced `main`; before edits ask project_quick_apply_approval with Apply on Main, Use Issue Flow, and Stop options, record selected_action: apply only for Apply on Main, and validate with skills/project-plan/scripts/validate-quick-apply.ps1 requiring verification commands and cleanup hook evidence. After a successful local commit, ask the next native continuation or permission question, including whether to push, review, revise, or stop. After every completed action, ask the next native continuation or permission question. Do not end the workflow until the user selects Stop or Done through native continuation input. A pushed commit, merged PR, created issue, saved plan, completed audit, or synced live plugin is not terminal."
