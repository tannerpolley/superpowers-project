version: 1
skills:
  project-plan:
    default_prompt: "Use $project-plan when an approved Superpowers Project spec or issue mirror needs an implementation plan. Use superpowers:writing-plans as the base workflow, save plans under docs/superpowers/plans in flat canonical roots, link one or more loose specs or a raw approved idea plus docs/superpowers/issues when present, and keep the lifecycle spec -> plan -> issue. plans include creation date and milestone identity where applicable, for example docs/superpowers/plans/<yyyy-mm-dd>-<milestone-or-category>-<slug>-plan.md. Milestone pages are index views; represent milestone/category views through frontmatter plus milestone indexes and treat nested canonical milestone artifact folders are drift. Use request_user_input in Default mode for material choices, require proof oracle evidence, require superpowers:test-driven-development for feature or bug plans unless explicit opt-out, require superpowers:systematic-debugging for bugs, and require superpowers:verification-before-completion before completion. After saving and self-reviewing the plan, summarize the plan in chat, ask native question project_plan_next_step with Project Issue First, Quick Apply, Review First, Revise Plan, and Stop options, then start the selected next skill in the same turn instead of only telling the user what to prompt next."
