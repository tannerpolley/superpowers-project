version: 1
skills:
  project-plan:
    default_prompt: "Use $project-plan when an approved Superpowers Project spec or issue mirror needs an implementation plan. Use superpowers:writing-plans as the base workflow, save plans under docs/superpowers/plans, link docs/superpowers/specs and docs/superpowers/issues when present, use request_user_input in Default mode for material choices, require proof oracle evidence, require superpowers:test-driven-development for feature or bug plans unless explicit opt-out, require superpowers:systematic-debugging for bugs, and require superpowers:verification-before-completion before completion. After saving and self-reviewing the plan, ask native question project_plan_next_step with Project Issue First, Subagent Execute, and Inline Execute options, then start the selected next skill in the same turn instead of only telling the user what to prompt next."
