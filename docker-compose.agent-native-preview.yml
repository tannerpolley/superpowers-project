services:
  agent-native-preview:
    build:
      context: .
      dockerfile: docker/agent-native-preview.Dockerfile
      args:
        AGENT_NATIVE_VERSION: "0.63.4"
    image: superpowers-project-agent-native-preview:local
    container_name: superpowers-agent-native-preview
    ports:
      - "8097:8080"
    environment:
      PLAN_DIR: ${PLAN_DIR:-/repo/plans/agent-native-companion-replacement}
      PLAN_KIND: ${PLAN_KIND:-plan}
      PORT: "8080"
