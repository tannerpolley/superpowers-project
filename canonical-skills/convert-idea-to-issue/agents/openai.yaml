version: 1
skills:
  convert-idea-to-issue:
    default_prompt: "Use $convert-idea-to-issue to turn broad repo intent or an explore_ideas_brief handoff into one scoped GitHub issue or an explicitly approved issue set with durable local issue files. Fresh intake may run in Default mode or Plan mode; when converting an $explore-ideas brief for local-main-sync, consume the milestone-local docs/milestones/<milestone>/ideas/<date>-<slug>.md source and reject legacy docs/ideas as canonical. Prefer Default mode with native request_user_input questions to choose the canonical_issue_scope: exactly which idea slice becomes the issue now, what is included, and what is excluded or deferred. Ask whether the work should be one issue or multiple issues; if multiple, ask whether the issue set stays in one milestone or spans milestones, then use to-issues only after approval. In Default mode, ask a final native publish approval before changing GitHub or files; in Plan mode, Treat Implement Plan as publish-issue-and-plan-only, never issue execution. Choose issue_source_policy: local-main-sync stays on the target repo default branch, writes local issue file(s) under docs/milestones/<milestone>/issues or docs/issues when milestones are disabled, creates/updates issue(s) with synced file/commit acknowledgement, then commits and pushes only those docs; external-github-only creates only externally sourced GitHub issue(s) and must not touch the target repo checkout. Require explicit target_repo, --repo target_repo, grill-with-docs, batched request_user_input, canonical_issue_scope, doc_grill_evidence/decision_log/question_log/unresolved_decisions/execution_boundary, milestone/full-roadmap alignment, and never create docs/plans, implementation branches, branch_policy, GoalBuddy, PRs, or implementation edits."
