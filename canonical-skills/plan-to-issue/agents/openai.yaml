version: 1
skills:
  plan-to-issue:
    default_prompt: "Use $plan-to-issue when a Superpowers Project spec, plan, PRD, or approved scope needs vertical slices published as GitHub issues and synced mirrors. Read docs/superpowers/specs, docs/superpowers/plans, docs/superpowers/PROJECT_CONTEXT.md, docs/superpowers/milestones, docs/superpowers/issues, and tracker label vocabulary from docs/agents when present; classify each slice as AFK or HITL; capture Blocked by relationships, Acceptance Criteria, GitHub Issue, GitHub Milestone, configured type/status labels, proof oracle, and Goal Command for AFK issues; write mirrors under docs/superpowers/issues; validate mirrors before handoff."
