version: 1
skills:
  setup-project-milestones:
    default_prompt: "Use $setup-project-milestones to prepare a GitHub repo for $explore-ideas, $convert-idea-to-issue, and $resolve-issue-with-goal. If the user asks to audit, clean up, repair, migrate, or verify an existing milestone setup, route to $milestones-doctor unless they explicitly ask for setup migration. Require target_repo and target_repo_root, GitHub remote/gh auth, setup-matt-pocock-skills markers, and default-branch apply. Read or ask approval to create docs/milestones/PROJECT_CONTEXT.md, propose roadmap/context-backed milestones, then use native request_user_input to ask which milestones the user wants. Configure docs/milestones/<milestone>/ideas, docs/milestones/<milestone>/issues, docs/agents/project-roadmap.md/json, bug/feature/task issue categories, type labels, issue forms, milestone/context mirroring, and Projects as dashboard evidence unless repo config requires them. Treat docs/ideas as legacy only and do not create it in strict setup. Do not create docs/issues fallback, docs/plans, milestone plans folders, implementation branches, GoalBuddy boards, PRs, merges, or product-code changes."
