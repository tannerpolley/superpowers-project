version: 1
skills:
  using-milestones:
    default_prompt: "Use $using-milestones as the Milestones meta-router only. Route first-time setup to $setup-project-milestones; existing audit, cleanup, migration, repair, or verification to $milestones-doctor; broad exploration to $explore-ideas with superpowers:brainstorming patterns; GitHub issue creation to $convert-idea-to-issue; issue-file implementation planning to $milestone-writing-issue-plan; and execution of one ready or externally sourced issue to $resolve-issue-with-goal. Also route Superpowers work to superpowers:using-superpowers, superpowers:brainstorming, superpowers:writing-plans, superpowers:test-driven-development, superpowers:systematic-debugging, superpowers:subagent-driven-development, superpowers:requesting-code-review, superpowers:receiving-code-review, and superpowers:verification-before-completion. Enforce milestone-backed idea briefs under docs/milestones/<milestone-folder>/ideas and local issue files under docs/milestones/<milestone-folder>/issues; treat docs/ideas as legacy only for pre-migration briefs. New broad ideas require an owning milestone or approved cross-cutting milestone folder. Do not implement workflow behavior in this router."
