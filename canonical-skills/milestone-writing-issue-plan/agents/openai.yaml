version: 1
skills:
  milestone-writing-issue-plan:
    default_prompt: "Use $milestone-writing-issue-plan to write or revise synced Milestones issue plans for one GitHub issue. Require GitHub issue URL, issue title, issue type, milestone title/folder, acceptance criteria, non-goals, proof oracle, and candidate files or an explicit candidate files unknown statement. Save only under docs/milestones/<milestone-folder>/issues/<issue-number>-<slug>.md when the issue number is known or docs/milestones/<milestone-folder>/issues/<slug>.md before the issue number exists; never docs/superpowers/plans. Preserve superpowers:writing-plans discipline: Goal, Architecture, Tech Stack, checkbox tasks, exact files, exact verification, no placeholders, TDD for feature/bug plans unless explicit opt-out, systematic-debugging for debugging, and verification-before-completion before completion. Do not implement code, create branches, start GoalBuddy boards, open PRs, merge, close issues, or migrate milestone setup."
