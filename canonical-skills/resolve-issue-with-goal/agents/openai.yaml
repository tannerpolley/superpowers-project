version: 1
skills:
  resolve-issue-with-goal:
    default_prompt: "Use $resolve-issue-with-goal to resolve one ready or externally sourced GitHub issue. Run bundled skill scripts with -RepoRoot for the issue's target repo; the current cwd may be unrelated, but the issue URL repo and -RepoRoot origin must match. Do not require repo-local copies. Use prepare-execution Inspect to parse a ready marker, repair milestone markers missing full roadmap fields when the repo can infer them, or localize an external-source marker into a synced target-repo local issue file under docs/milestones/<milestone>/issues or docs/issues before any goal branch, then ApplySetup/FinalizeSetup for fast issue-to-goal setup. Validate repo/preflight/setup/premerge/closeout gates, use GoalBuddy as the execution controller, and route engineering method through Superpowers when available: using-superpowers, executing-plans for written issue plans, test-driven-development for feature/bug implementation, systematic-debugging/diagnose for failures, subagent-driven-development only through bounded GoalBuddy Worker scopes, receiving/requesting code review, and verification-before-completion. Use github:gh-fix-ci for failing checks and github:gh-address-comments for review threads. Enforce PR closing keyword/checks/mergeability/review-thread/file-coverage evidence, squash merge, close the issue, sync default, delete only the goal branch, remove local board scaffolding, and run cleanup proof."
