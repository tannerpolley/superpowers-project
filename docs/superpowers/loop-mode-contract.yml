loop_mode_contract:
  version: 1
  authority:
    workflow_mode_ledger: required
    selected_mode: looping
    auto_mode_may_authorize_queue_draining: false
  phase_order:
    - startup_version_check
    - workflow_mode_ledger_validation
    - run_ledger_validation
    - budget_check_before_selection
    - candidate_selection
    - owner_route_execution
    - verifier_proof
    - budget_recheck_after_candidate
    - policy_continuation_decision
  candidate_source_precedence:
    - active_backlog
    - ready_issue_mirror
    - approved_plan
    - approved_spec
    - audit_finding
    - alignment_drift
    - version_drift
    - live_sync_drift
  invariants:
    one_candidate_per_iteration: true
    second_selection_requires:
      event_type: continuation_granted
      source: policy
      acceptance: passed
      verifier: passed
      budget_recheck: passed
    dirty_repo_blocks_selection: true
    owner_route_must_match_selected_route: true
    budget_must_pass_before_selection: true
    budget_must_be_rechecked_after_candidate: true
    no_ready_candidates_require_no_ready_proof: true
    historical_checkbox_candidates_must_be_skipped: true
    final_done_requires:
      question_id: project_loop_final_health_gate
      selected_option: Done
      terminal_state: done
      clean_repo: true
      run_ledger_valid: true
      verifier_valid: true
      metrics_valid: true
