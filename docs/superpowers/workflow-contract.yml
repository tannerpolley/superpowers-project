version: 2
helpers:
  advanced-user-input:
    owns: native-continuation-policy
workflow_skills:
  align-project:
    owner: align-project
    purpose: Structure alignment, migration review, tracker alignment, live sync verification, and repair planning.
    question_ids:
    - project_align_final_health_gate
    - project_align_next_step
    - project_align_plan_issue_route
    - project_align_prepare_route
    - project_align_reiteration_route
    - project_align_repair_group
    - project_align_review_evidence_route
    final_health_gate: project_align_final_health_gate
    final_options:
    - Done
    - Revisit
    - Stop
    top_level_options:
    - 'Yes'
    - Revisit
    - Stop
    nested_routes:
    - question_id: project_align_repair_group
      parent_option: true
      options:
      - Apply Repair
      - Prepare Repair Work
    - question_id: project_align_prepare_route
      parent_option: Prepare Repair Work
      options:
      - Create Planning Spec
      - Plan Or Issue Repair
    - question_id: project_align_plan_issue_route
      parent_option: Plan Or Issue Repair
      options:
      - Plan Repair
      - Create Issue
    - question_id: project_align_reiteration_route
      parent_option: Revisit
      options:
      - Run Align Again
      - Review Or Gather Evidence
    - question_id: project_align_review_evidence_route
      parent_option: Review Or Gather Evidence
      options:
      - Review First
      - Gather More Evidence
    validators:
    - scripts/validate.sh
    - scripts/sync-live.sh --validate
    artifacts:
    - docs/superpowers/milestones
    - docs/superpowers/issues
    - docs/superpowers/plans
    next_routes:
    - write-plan
    - create-issues
    - merge-changes
    gates:
    - question_id: project_align_final_health_gate
      gate_type: final_health
      prompt: Alignment is healthy. Should I close this workflow as done?
      options:
      - label: Done
        terminal_state: done
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
    - question_id: project_align_next_step
      gate_type: top_level_continuation
      prompt: Should I continue on with the workflow?
      options:
      - label: 'Yes'
        terminal_state: continue
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
    - question_id: project_align_plan_issue_route
      gate_type: data_selection
      prompt: Should I plan the repair or create an issue?
      parent_option: Plan Or Issue Repair
      options:
      - label: Plan Repair
        terminal_state: continue
      - label: Create Issue
        terminal_state: continue
    - question_id: project_align_prepare_route
      gate_type: data_selection
      prompt: Which repair artifact should be prepared?
      parent_option: Prepare Repair Work
      options:
      - label: Create Planning Spec
        terminal_state: continue
      - label: Plan Or Issue Repair
        terminal_state: continue
    - question_id: project_align_reiteration_route
      gate_type: nested_revisit_route
      prompt: How should I revisit this audit?
      parent_option: Revisit
      options:
      - label: Run Align Again
        terminal_state: revisit
      - label: Review Or Gather Evidence
        terminal_state: revisit
    - question_id: project_align_repair_group
      gate_type: nested_yes_route
      prompt: How should this audit turn into repair work?
      parent_option: true
      options:
      - label: Apply Repair
        terminal_state: continue
      - label: Prepare Repair Work
        terminal_state: continue
    - question_id: project_align_review_evidence_route
      gate_type: nested_revisit_route
      prompt: Should I review the audit or gather more evidence?
      parent_option: Review Or Gather Evidence
      options:
      - label: Review First
        terminal_state: revisit
      - label: Gather More Evidence
        terminal_state: revisit
  audit-project:
    owner: audit-project
    purpose: Evidence-backed code, workflow, test, skill, or repo behavior audit findings before repair planning.
    question_ids:
    - project_audit_next_step
    - project_audit_progress_route
    - project_audit_revisit_route
    final_health_gate: null
    top_level_options:
    - 'Yes'
    - Revisit
    - Stop
    nested_routes:
    - question_id: project_audit_progress_route
      parent_option: true
      options:
      - Write Plan
      - Auto Mode
      - Create Issues
    - question_id: project_audit_revisit_route
      parent_option: Revisit
      options:
      - Review First
      - Gather More Evidence
      - Rerun Focused Audit
    validators:
    - scripts/validate.sh
    artifacts:
    - docs/superpowers/specs
    - docs/superpowers/plans
    next_routes:
    - write-plan
    - create-issues
    gates:
    - question_id: project_audit_next_step
      gate_type: top_level_continuation
      prompt: Should I continue on with the workflow?
      options:
      - label: 'Yes'
        terminal_state: continue
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
    - question_id: project_audit_progress_route
      gate_type: data_selection
      prompt: Which repair route should start from the findings spec?
      parent_option: true
      options:
      - label: Write Plan
        terminal_state: continue
      - label: Auto Mode
        terminal_state: continue
      - label: Create Issues
        terminal_state: continue
    - question_id: project_audit_revisit_route
      gate_type: nested_revisit_route
      prompt: How should I revisit these findings?
      parent_option: Revisit
      options:
      - label: Review First
        terminal_state: revisit
      - label: Gather More Evidence
        terminal_state: revisit
      - label: Rerun Focused Audit
        terminal_state: revisit
  brainstorm-spec:
    owner: brainstorm-spec
    purpose: Repo-backed ideas, specs, PRDs, architecture concepts, and broad feature requests.
    question_ids:
    - project_brainstorm_multi_spec_route
    - project_brainstorm_next_step
    - project_brainstorm_plan_route
    - project_brainstorm_reiteration_route
    - project_brainstorm_review_restart_route
    - project_brainstorm_visual_companion
    final_health_gate: null
    top_level_options:
    - 'Yes'
    - Revisit
    - Stop
    nested_routes:
    - question_id: project_brainstorm_plan_route
      parent_option: true
      options:
      - Create One Plan
      - Multi-Spec Planning
    - question_id: project_brainstorm_multi_spec_route
      parent_option: true
      options:
      - Plan Multiple Specs
      - Create Multiple Plans
    - question_id: project_brainstorm_reiteration_route
      parent_option: Revisit
      options:
      - Revise Spec
      - Review Or Restart
    - question_id: project_brainstorm_review_restart_route
      parent_option: Revisit
      options:
      - Review First
      - Re-run Brainstorm
    validators:
    - scripts/validate.sh
    artifacts:
    - docs/superpowers/specs
    next_routes:
    - companion-interface
    - write-plan
    gates:
    - question_id: project_brainstorm_multi_spec_route
      gate_type: data_selection
      prompt: How should multiple specs become plans?
      parent_option: true
      options:
      - label: Plan Multiple Specs
        terminal_state: continue
      - label: Create Multiple Plans
        terminal_state: continue
    - question_id: project_brainstorm_next_step
      gate_type: top_level_continuation
      prompt: Should I continue on with the workflow?
      options:
      - label: 'Yes'
        terminal_state: continue
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
    - question_id: project_brainstorm_plan_route
      gate_type: data_selection
      prompt: How should planning start from this brainstorm?
      parent_option: true
      options:
      - label: Create One Plan
        terminal_state: continue
      - label: Multi-Spec Planning
        terminal_state: continue
    - question_id: project_brainstorm_reiteration_route
      gate_type: nested_revisit_route
      prompt: How should I revisit this brainstorm output?
      parent_option: Revisit
      options:
      - label: Revise Spec
        terminal_state: revisit
      - label: Review Or Restart
        terminal_state: revisit
    - question_id: project_brainstorm_review_restart_route
      gate_type: nested_revisit_route
      prompt: Should I review this brainstorm or start another one?
      parent_option: Revisit
      options:
      - label: Review First
        terminal_state: revisit
      - label: Re-run Brainstorm
        terminal_state: revisit
    - question_id: project_brainstorm_visual_companion
      gate_type: data_selection
      prompt: Use a visual companion for this brainstorm?
      options:
      - label: Use Visual Companion
        terminal_state: continue
        next_route: companion-interface
      - label: Skip Visual Companion
        terminal_state: continue
  companion-interface:
    owner: companion-interface
    purpose: Optional Agent-Native visual-plan or visual-recap review surface.
    question_ids: []
    final_health_gate: null
    top_level_options: []
    nested_routes: []
    validators:
    - scripts/test-companion-interface.sh
    - scripts/test-agent-native-companion-preview.sh
    artifacts:
    - docs/superpowers/plans
    next_routes:
    - brainstorm-spec
    - write-plan
    - merge-changes
    gates: []
  create-issues:
    owner: create-issues
    purpose: Vertical-slice GitHub issues and synced local issue mirrors.
    question_ids:
    - project_issue_execution_route
    - project_issue_hierarchy_children
    - project_issue_hierarchy_mode
    - project_issue_hierarchy_parent
    - project_issue_hierarchy_publish
    - project_issue_hierarchy_tracker_fields
    - project_issue_hierarchy_wrapper
    - project_issue_next_step
    - project_issue_orchestrate_route
    - project_issue_resolve_route
    - project_issue_reiteration_route
    - project_issue_review_repair_route
    final_health_gate: null
    top_level_options:
    - 'Yes'
    - Revisit
    - Stop
    nested_routes:
    - question_id: project_issue_execution_route
      parent_option: true
      options:
      - Resolve Issues
      - Orchestrate Issues
    - question_id: project_issue_hierarchy_mode
      parent_option: true
      options:
      - Flat Issues
      - Issue Set
      - Sub-Milestone
    - question_id: project_issue_hierarchy_parent
      parent_option: true
      options:
      - Use Proposed Parent
      - Use Existing Parent
      - Revise Parent
    - question_id: project_issue_hierarchy_wrapper
      parent_option: true
      options:
      - No Wrapper
      - Use Wrappers
    - question_id: project_issue_hierarchy_children
      parent_option: true
      options:
      - Use Proposed Children
      - Revise Children
    - question_id: project_issue_hierarchy_tracker_fields
      parent_option: true
      options:
      - Use Proposed Tracker Fields
      - Revise Tracker Fields
    - question_id: project_issue_resolve_route
      parent_option: true
      options:
      - Resolve First Ready
      - Resolve Selected
    - question_id: project_issue_orchestrate_route
      parent_option: true
      options:
      - Orchestrate First Ready
      - Orchestrate Selected
    - question_id: project_issue_reiteration_route
      parent_option: Revisit
      options:
      - Revise Or Reslice Issues
      - Review Or Repair Issues
    - question_id: project_issue_review_repair_route
      parent_option: Revisit
      options:
      - Review First
      - Repair Issue Mirrors
    validators:
    - skills/create-issues/scripts/validate-issue-mirror.sh
    artifacts:
    - docs/superpowers/issues
    next_routes:
    - resolve-issue
    - orchestrate-issues
    gates:
    - question_id: project_issue_execution_route
      gate_type: data_selection
      prompt: How should these issues be executed?
      parent_option: true
      options:
      - label: Resolve Issues
        terminal_state: continue
      - label: Orchestrate Issues
        terminal_state: continue
    - question_id: project_issue_next_step
      gate_type: top_level_continuation
      prompt: Should I continue on with the workflow?
      options:
      - label: 'Yes'
        terminal_state: continue
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
    - question_id: project_issue_orchestrate_route
      gate_type: data_selection
      prompt: Which issue should be delegated to a worker?
      parent_option: true
      options:
      - label: Orchestrate First Ready
        terminal_state: continue
      - label: Orchestrate Selected
        terminal_state: continue
    - question_id: project_issue_hierarchy_children
      gate_type: data_selection
      prompt: Which child issues belong under the selected parent or wrapper?
      parent_option: true
      options:
      - label: Use Proposed Children
        terminal_state: continue
      - label: Revise Children
        terminal_state: revisit
    - question_id: project_issue_hierarchy_mode
      gate_type: data_selection
      prompt: How should this issue set be represented in GitHub?
      parent_option: true
      options:
      - label: Flat Issues
        terminal_state: continue
      - label: Issue Set
        terminal_state: continue
      - label: Sub-Milestone
        terminal_state: continue
    - question_id: project_issue_hierarchy_parent
      gate_type: data_selection
      prompt: What parent issue title or existing parent should own this hierarchy?
      parent_option: true
      options:
      - label: Use Proposed Parent
        terminal_state: continue
      - label: Use Existing Parent
        terminal_state: continue
      - label: Revise Parent
        terminal_state: revisit
    - question_id: project_issue_hierarchy_publish
      gate_type: approval
      prompt: Approve this dry command receipt for GitHub issue mutation?
      parent_option: true
      options:
      - label: Publish Approved Commands
        approval_effect: publish-approved-commands
      - label: Revise Before Publish
        approval_effect: revise-before-publish
    - question_id: project_issue_hierarchy_tracker_fields
      gate_type: data_selection
      prompt: Which GitHub Milestone, labels, and issue types should be applied?
      parent_option: true
      options:
      - label: Use Proposed Tracker Fields
        terminal_state: continue
      - label: Revise Tracker Fields
        terminal_state: revisit
    - question_id: project_issue_hierarchy_wrapper
      gate_type: data_selection
      prompt: Should this hierarchy include plan-wrapper issues?
      parent_option: true
      options:
      - label: No Wrapper
        terminal_state: continue
      - label: Use Wrappers
        terminal_state: continue
    - question_id: project_issue_resolve_route
      gate_type: data_selection
      prompt: Which issue should be resolved directly?
      parent_option: true
      options:
      - label: Resolve First Ready
        terminal_state: continue
      - label: Resolve Selected
        terminal_state: continue
    - question_id: project_issue_reiteration_route
      gate_type: nested_revisit_route
      prompt: How should I revisit this issue set?
      parent_option: Revisit
      options:
      - label: Revise Or Reslice Issues
        terminal_state: revisit
      - label: Review Or Repair Issues
        terminal_state: revisit
    - question_id: project_issue_review_repair_route
      gate_type: nested_revisit_route
      prompt: Should I review the issues or repair mirrors?
      parent_option: Revisit
      options:
      - label: Review First
        terminal_state: revisit
      - label: Repair Issue Mirrors
        terminal_state: revisit
  implement-plan:
    owner: implement-plan
    purpose: Approved non-issue implementation plan execution with branch-backed proof.
    question_ids:
    - implement_plan_push_permission
    - implement_plan_topology
    - project_implement_next_step
    - project_implement_reiteration_route
    final_health_gate: null
    top_level_options:
    - 'Yes'
    - Revisit
    - Stop
    nested_routes:
    - question_id: implement_plan_push_permission
      parent_option: true
      options:
      - Push Branch
      - Hold
    - question_id: project_implement_reiteration_route
      parent_option: Revisit
      options:
      - Revise Branch
      - Review Evidence
    validators:
    - skills/implement-plan/scripts/test-scenarios.sh
    artifacts:
    - docs/superpowers/plans
    next_routes:
    - merge-changes
    gates:
    - question_id: implement_plan_push_permission
      gate_type: permission
      prompt: Should I push this implementation branch before merge routing?
      parent_option: true
      options:
      - label: Push Branch
        permission_effect: push-branch
      - label: Hold
        permission_effect: hold
    - question_id: implement_plan_topology
      gate_type: topology
      prompt: How should this approved plan be implemented?
      parent_option: true
      allow_terminal_options: true
      options:
      - label: Inline
        topology: inline
      - label: Worker
        topology: worker
      - label: Stop
        terminal_state: stop
    - question_id: project_implement_next_step
      gate_type: top_level_continuation
      prompt: Should I continue on with the workflow?
      options:
      - label: 'Yes'
        terminal_state: continue
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
    - question_id: project_implement_reiteration_route
      gate_type: nested_revisit_route
      prompt: How should I revisit this implemented plan?
      parent_option: Revisit
      options:
      - label: Revise Branch
        terminal_state: revisit
      - label: Review Evidence
        terminal_state: revisit
  initiate-workflow:
    owner: initiate-workflow
    entrypoint: true
    external_parents:
    - startup
    - issue request
    purpose: Route setup, brainstorming, audits, planning, issue creation, issue resolution, orchestration, merge cleanup,
      and alignment checks.
    question_ids:
    - project_issue_resolution_route
    - project_workflow_mode
    final_health_gate: null
    top_level_options: []
    nested_routes:
    - question_id: project_workflow_mode
      parent_option: startup
      options:
      - Manual Mode
      - Auto Mode
      - Looping Mode
    - question_id: project_issue_resolution_route
      parent_option: issue request
      options:
      - Project Resolve
      - Project Orchestrate
      - Review First
    validators:
    - scripts/validate-workflow-mode-ledger.sh
    - scripts/validate-auto-mode-authorization.sh
    artifacts:
    - .superpowers/runs
    next_routes:
    - setup-project
    - brainstorm-spec
    - audit-project
    - write-plan
    - create-issues
    - resolve-issue
    - orchestrate-issues
    - merge-changes
    - align-project
    - loop-controller
    gates:
    - question_id: project_workflow_mode
      gate_type: workflow_mode
      prompt: How should I run this Superpowers Project workflow?
      parent_option: startup
      options:
      - label: Manual Mode
        terminal_state: continue
      - label: Auto Mode
        terminal_state: continue
      - label: Looping Mode
        terminal_state: continue
    - question_id: project_issue_resolution_route
      gate_type: data_selection
      prompt: How should this issue be executed?
      parent_option: issue request
      options:
      - label: Project Resolve
        terminal_state: continue
      - label: Project Orchestrate
        terminal_state: continue
      - label: Review First
        terminal_state: revisit
  loop-controller:
