    - skills/loop-controller/scripts/validate-budget.sh
    - skills/loop-controller/scripts/validate-terminal-closeout.sh
    artifacts:
    - .superpowers/runs
    next_routes:
    - brainstorm-spec
    - write-plan
    - create-issues
    - resolve-issue
    - orchestrate-issues
    - merge-changes
    - audit-project
    - align-project
    gates:
    - question_id: project_loop_final_health_gate
      gate_type: final_health
      prompt: Is this loop run fully complete?
      options:
      - label: Done
        terminal_state: done
      - label: Revisit
        terminal_state: revisit
      - label: Stop
        terminal_state: stop
